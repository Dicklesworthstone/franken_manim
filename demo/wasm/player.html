<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrankenManim — FMTL timeline player</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; gap: 12px; padding: 24px;
    background: #101014; color: #e8e8ee;
    font: 14px/1.5 system-ui, sans-serif;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button, select {
    background: #1c1c24; color: inherit; border: 1px solid #3a3a48;
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  input[type="range"] { width: 280px; }
  canvas {
    background: #000; border: 1px solid #2a2a36; border-radius: 8px;
    width: min(100%, 960px); height: auto; aspect-ratio: 16 / 9;
  }
  #status { color: #9a9ab0; min-height: 1.5em; max-width: 900px; overflow-wrap: anywhere; }
  #status.err { color: #ff7a7a; }
  .hint { color: #9a9ab0; margin: 0; }
</style>
</head>
<body>
  <h1>FrankenManim — FMTL timeline player</h1>
  <div class="controls">
    <label>Open recording <input id="bundleFile" type="file" accept=".fmtl" disabled></label>
    <button id="loadDemo" disabled>Load demo</button>
  </div>
  <p class="hint">Local files stay in your browser. Camera and soundtrack recordings are supported. Pictures render in a worker; press Play to enable audio. Input limit: 256 MiB.</p>
  <div class="controls">
    <label>Frame <input id="scrub" type="range" min="0" max="0" value="0" disabled></label>
    <button id="play" disabled>Play</button>
    <button id="restartWorker" disabled>Restart picture worker</button>
    <span id="frameLabel">0 / 0</span>
  </div>
  <div class="controls">
    <label>Preview resolution <select id="resolution">
      <option value="auto" selected>Auto (high-DPI, up to 1080p)</option>
      <option value="640x360">640 × 360 (fast)</option>
      <option value="1280x720">1280 × 720</option>
      <option value="1920x1080">1920 × 1080</option>
      <option value="1080x1920">1080 × 1920 (portrait)</option>
      <option value="1080x1080">1080 × 1080 (square)</option>
    </select></label>
    <span id="viewportLabel" aria-live="polite">640 × 360</span>
  </div>
  <div class="controls" id="labels"></div>
  <canvas id="canvas" width="640" height="360"></canvas>
  <div id="status" role="status" aria-live="polite">loading worker…</div>

<script type="module">
  import {mountTimelinePlayer} from "./player-ui.mjs";
  mountTimelinePlayer();
</script>
</body>
</html>
