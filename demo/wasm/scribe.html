<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrankenManim · Typesetter</title>
<style>
  :root { color-scheme: dark; font: 1rem/1.5 system-ui, sans-serif; }
  body { max-width: 54rem; margin: 3rem auto; padding: 0 1rem; }
  form { display: grid; gap: .8rem; }
  label { display: grid; gap: .25rem; }
  textarea, select, button { font: inherit; padding: .5rem; }
  button { justify-self: start; }
  canvas { display: block; width: 100%; margin: 1rem 0; background: black; }
</style>
<h1>Typesetter</h1>
<p><a href="./player.html#compose">Animate a transition between two typesets</a></p>
<form>
  <label>Content type <select id="kind"><option value="math">Display math</option><option value="textext">TeX prose with inline math</option><option value="text">Plain text</option><option value="markup">Markup text</option></select></label>
  <label>Source <textarea id="source" rows="3" spellcheck="false">\frac{d}{dx}x^2 = 2x</textarea></label>
  <div><button type="submit" disabled>Render</button> <button type="button" id="save" disabled>Save preview as .fmtl</button></div>
  <div><label for="ink">Selection color</label>
    <input type="color" id="ink" value="#44c9fa">
    <button type="button" id="paint" disabled>Apply to selected source</button>
  </div>
</form>
<canvas width="864" height="360" aria-label="Typeset preview"></canvas>
<p role="status" id="status">Loading bundled fonts…</p>
<script type="module">
  const form = document.querySelector("form");
  const status = document.querySelector("#status");
  const canvas = document.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const pixels = new Uint8Array(canvas.width * canvas.height * 4);
  const frame = new ImageData(new Uint8ClampedArray(pixels.buffer), canvas.width, canvas.height);
  try {
    const { default: init, FmnScribe } = await import("./pkg-scribe/fmn_wasm.js");
    await init();
    const scribe = new FmnScribe();
    const save = document.querySelector("#save");
    const source = document.querySelector("#source");
    const kind = document.querySelector("#kind");
    const paint = document.querySelector("#paint");
    const ink = document.querySelector("#ink");
    let preview, renderedSource, renderedKind;
    function updatePaint() {
      paint.disabled = !preview || source.value !== renderedSource || kind.value !== renderedKind ||
        source.selectionStart === source.selectionEnd;
    }
    function draw(object) {
      object.render_into(canvas.width, canvas.height, pixels);
      ctx.putImageData(frame, 0, 0);
    }
    function render() {
      let object;
      try {
        object = scribe.typeset(kind.value, source.value, 90);
        draw(object);
        preview?.free();
        preview = object;
        object = undefined;
        renderedSource = source.value;
        renderedKind = kind.value;
        updatePaint();
        save.disabled = false;
        status.textContent = "";
      } catch (error) {
        status.textContent = String(error);
      } finally {
        object?.free();
      }
    }
    form.addEventListener("submit", event => { event.preventDefault(); render(); });
    source.addEventListener("select", updatePaint);
    source.addEventListener("input", updatePaint);
    source.addEventListener("selectionchange", updatePaint);
    kind.addEventListener("change", updatePaint);
    paint.addEventListener("click", () => {
      try {
        const count = preview.color_range(source.selectionStart, source.selectionEnd, ink.value);
        draw(preview);
        status.textContent = count
          ? `Colored ${count} ${count === 1 ? "part" : "parts"}.`
          : "The selection contains no complete glyph, rule, or path.";
      } catch (error) {
        status.textContent = String(error);
      }
    });
    save.addEventListener("click", () => {
      try {
        const url = URL.createObjectURL(new Blob([preview.to_bundle()]));
        const link = document.createElement("a");
        link.href = url;
        link.download = "typeset.fmtl";
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) {
        status.textContent = String(error);
      }
    });
    form.querySelector("button").disabled = false;
    render();
  } catch (error) {
    status.textContent = "Could not load the Scribe build. " + error;
  }
</script>
</html>
