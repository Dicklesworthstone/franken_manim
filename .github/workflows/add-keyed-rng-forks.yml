name: Add Keyed RNG Forks

on:
  workflow_run:
    workflows: ["Extend RNG Replay API"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-keyed-rng-forks
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.repository == 'Dicklesworthstone/franken_manim' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install governed toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-05 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup override set nightly-2026-07-05
          python3 -m pip install --user --break-system-packages numpy || python3 -m pip install --user numpy

      - name: Implement versioned domain-separated keyed forks
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/extend-rng-replay-api.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/fmn-core/src/rng.rs")
          source = path.read_text(encoding="utf-8")

          version_marker = "pub const KEYED_FORK_LAYOUT_VERSION: u32 = 1;"
          if version_marker not in source:
              anchor = "pub const RNG_LAYOUT_VERSION: u32 = 1;\n"
              if source.count(anchor) != 1:
                  raise SystemExit("RNG layout version anchor drifted")
              source = source.replace(
                  anchor,
                  anchor
                  + "\n/// Version of the domain-separated arbitrary-key fork encoding.\n"
                  + "/// Existing named, sequential, and frame streams are unchanged.\n"
                  + version_marker
                  + "\n\n"
                  + "const KEYED_FORK_DOMAIN_START: u32 = 0x464d_4b31; // `FMK1`\n"
                  + "const KEYED_FORK_DOMAIN_END: u32 = 0x314b_4d46; // `1KMF`\n",
                  1,
              )

          method_marker = "    pub fn fork_keyed(&self, key: &[u32]) -> Pcg64Dxsm {\n"
          if method_marker not in source:
              anchor = '''    pub fn fork_frame(&self, frame_index: u64) -> Pcg64Dxsm {
        let mut key = Vec::with_capacity(self.key.len() + 2);
        key.extend_from_slice(&self.key);
        key.push(frame_index as u32);
        key.push((frame_index >> 32) as u32);
        let sequence = SeedSequence::with_spawn_key(self.seed, &key);
        Pcg64Dxsm::from_seed_sequence(&sequence)
    }
'''
              if source.count(anchor) != 1:
                  raise SystemExit("frame-fork implementation anchor drifted")
              addition = anchor + '''
    /// Derive a pure stream from an arbitrary stable key.
    ///
    /// The canonical suffix is `FMK1, len, key..., 1KMF`. Its minimum three
    /// words make it structurally disjoint from the existing two-word frame
    /// suffix, while length and terminal sentinels make concatenation
    /// boundaries unambiguous. Call order and thread placement are irrelevant.
    #[must_use]
    pub fn fork_keyed(&self, key: &[u32]) -> Pcg64Dxsm {
        let key_len = u32::try_from(key.len()).expect("RNG fork key exceeds u32 length");
        let mut spawn_key = Vec::with_capacity(self.key.len() + key.len() + 3);
        spawn_key.extend_from_slice(&self.key);
        spawn_key.push(KEYED_FORK_DOMAIN_START);
        spawn_key.push(key_len);
        spawn_key.extend_from_slice(key);
        spawn_key.push(KEYED_FORK_DOMAIN_END);
        let sequence = SeedSequence::with_spawn_key(self.seed, &spawn_key);
        Pcg64Dxsm::from_seed_sequence(&sequence)
    }

    /// Convenience keyed fork for a stable 64-bit entity or task identifier.
    #[must_use]
    pub fn fork_entity(&self, entity_id: u64) -> Pcg64Dxsm {
        self.fork_keyed(&[entity_id as u32, (entity_id >> 32) as u32])
    }
'''
              source = source.replace(anchor, addition, 1)

          test_marker = "    fn keyed_forks_are_stable_order_independent_and_domain_separated()"
          if test_marker not in source:
              insertion = source.rfind("}\n")
              if insertion < 0:
                  raise SystemExit("rng test module terminator not found")
              tests = '''    #[test]
    fn keyed_forks_are_stable_order_independent_and_domain_separated() {
        assert_eq!(KEYED_FORK_LAYOUT_VERSION, 1);
        let substream = RngRoot::from_seed(0xfeed_face).substream("particles");
        let keys = [
            vec![],
            vec![0],
            vec![1],
            vec![1, 2],
            vec![1, 2, 0],
            vec![u32::MAX, 7, 11],
        ];
        let forward: Vec<u64> = keys
            .iter()
            .map(|key| substream.fork_keyed(key).next_u64())
            .collect();
        let mut reverse: Vec<u64> = keys
            .iter()
            .rev()
            .map(|key| substream.fork_keyed(key).next_u64())
            .collect();
        reverse.reverse();
        assert_eq!(forward, reverse);
        assert_eq!(
            substream.fork_keyed(&[1, 2]).next_u64(),
            substream.fork_keyed(&[1, 2]).next_u64()
        );
        assert_ne!(
            substream.fork_keyed(&[1, 2]).next_u64(),
            substream.fork_keyed(&[1, 2, 0]).next_u64()
        );
        for frame in [0_u64, 1, u64::from(u32::MAX), u64::MAX] {
            assert_ne!(
                substream.fork_keyed(&[]).next_u64(),
                substream.fork_frame(frame).next_u64(),
                "keyed and frame domains collided at frame {frame}"
            );
        }
    }

    #[test]
    fn entity_forks_match_the_canonical_two_word_key() {
        let substream = RngRoot::from_seed(17).substream("entities");
        for id in [0_u64, 1, u64::from(u32::MAX), 1_u64 << 63, u64::MAX] {
            let words = [id as u32, (id >> 32) as u32];
            let mut convenience = substream.fork_entity(id);
            let mut canonical = substream.fork_keyed(&words);
            let mut left = [0_u64; 32];
            let mut right = [0_u64; 32];
            convenience.fill_u64(&mut left);
            canonical.fill_u64(&mut right);
            assert_eq!(left, right);
            assert_eq!(convenience.state(), canonical.state());
        }
    }

    #[test]
    fn keyed_consumers_do_not_shift_existing_named_or_frame_streams() {
        let root = RngRoot::from_seed(731);
        let substream = root.substream("layout");
        let sequential_before: Vec<u64> = {
            let mut generator = substream.sequential();
            (0..16).map(|_| generator.next_u64()).collect()
        };
        let frame_before: Vec<u64> = (0..16)
            .map(|frame| substream.fork_frame(frame).next_u64())
            .collect();

        for entity in 0..10_000 {
            let mut generator = substream.fork_entity(entity);
            let _ = generator.next_u64();
        }

        let sequential_after: Vec<u64> = {
            let mut generator = substream.sequential();
            (0..16).map(|_| generator.next_u64()).collect()
        };
        let frame_after: Vec<u64> = (0..16)
            .map(|frame| substream.fork_frame(frame).next_u64())
            .collect();
        assert_eq!(sequential_before, sequential_after);
        assert_eq!(frame_before, frame_after);
    }

'''
              source = source[:insertion] + tests + source[insertion:]
          path.write_text(source, encoding="utf-8")
          PY
          cargo fmt --all

      - name: Prove compatibility, noninterference, and the full product gate
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p fmn-core --all-targets
          cargo test -p fmn-core
          cargo test -p fmn-core --test rng_parity
          cargo check --target wasm32-unknown-unknown -p fmn-core
          cargo clippy -p fmn-core --all-targets -- -D warnings
          bash scripts/check.sh
          git diff --check

      - name: Update changelog and implementation status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "### Domain-separated keyed RNG forks (2026-09-03)"
          if marker not in changelog:
              entry = (
                  "\n" + marker + "\n\n"
                  "- Added `Substream::fork_keyed` with a versioned, length-delimited, terminal-delimited spawn-key encoding that is structurally disjoint from frame forks.\n"
                  "- Added `Substream::fork_entity` for stable 64-bit object/task identifiers.\n"
                  "- Proved call-order invariance, key-boundary distinction, frame-domain separation, convenience/canonical equivalence, and noninterference with all existing sequential and frame vectors.\n"
              )
              first_break = changelog.find("\n", changelog.find("#"))
              changelog = changelog[: first_break + 1] + entry + changelog[first_break + 1 :]
              changelog_path.write_text(changelog, encoding="utf-8")

          status_candidates = [
              Path("IMPLEMENTATION_STATUS.md"),
              Path("docs/IMPLEMENTATION_STATUS.md"),
              Path("docs/implementation_status.md"),
          ]
          status_path = next((path for path in status_candidates if path.exists()), status_candidates[-1])
          status = status_path.read_text(encoding="utf-8") if status_path.exists() else "# Implementation Status\n"
          marker = "## 2026-09-03: canonical keyed RNG forks"
          if marker not in status:
              status += (
                  "\n" + marker + "\n\n"
                  "**Implemented and gated:** stable arbitrary-key and 64-bit entity forks. Their versioned domain encoding cannot alias the legacy two-word frame suffix, preserves every existing stream and fixture, and gives parallel object/task consumers a canonical order-independent derivation instead of ad hoc seed arithmetic.\n"
              )
              status_path.parent.mkdir(parents=True, exist_ok=True)
              status_path.write_text(status, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          sentence = "Stable object- and task-level work uses the versioned `fork_keyed`/`fork_entity` domain, whose encoding is structurally separate from legacy frame forks and therefore cannot shift existing renders."
          if sentence not in readme:
              anchor = "### Deterministic RNG authority"
              location = readme.find(anchor)
              if location < 0:
                  raise SystemExit("README RNG authority section is absent")
              next_heading = readme.find("\n### ", location + len(anchor))
              if next_heading < 0:
                  next_heading = readme.find("\n## ", location + len(anchor))
              if next_heading < 0:
                  next_heading = len(readme)
              readme = readme[:next_heading] + "\n\n" + sentence + readme[next_heading:]
              readme_path.write_text(readme, encoding="utf-8")
          PY
          git diff --check

      - name: Commit tested keyed-fork functionality directly to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/add-keyed-rng-forks.yml
          git add -A
          git config user.name "FrankenManim Keyed RNG"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(core): add domain-separated keyed RNG forks" -m "Give deterministic entity/task consumers a canonical versioned spawn-key encoding that cannot alias the preserved frame-fork domain. Prove order invariance, key boundary separation, frame noncollision, existing-stream noninterference, native/wasm compilation, and the full mandatory Gauntlet."
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
            cargo test -p fmn-core --test rng_parity
            bash scripts/check.sh
          fi
          git push origin HEAD:main
