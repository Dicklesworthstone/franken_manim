name: FM AI1 Authority Verifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fm-ai1-authority-verifier.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fm-ai1-authority-verifier
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  EXPECTED_FNP_PIN: "7494a2ee97a54b06b8bd4a76c0c520edbc53cd69"

jobs:
  verify-and-publish:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Capture source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "TESTED_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p artifacts/fm-ai1-ci
          exec > >(tee -a artifacts/fm-ai1-ci/verifier.log) 2>&1
          git status --short --branch

      - name: Install governed toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-05 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup override set nightly-2026-07-05
          rustc --version --verbose | tee artifacts/fm-ai1-ci/rustc.txt

      - name: Normalize governed RNG source and allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = os.environ["EXPECTED_FNP_PIN"]
          cargo_path = Path("Cargo.toml")
          cargo = cargo_path.read_text(encoding="utf-8")
          packages = ("fnp-dtype", "fnp-ndarray", "fnp-io", "fnp-random-core")
          for package in packages:
              pattern = rf'(^' + re.escape(package) + rf' = \{{ git = "https://github.com/Dicklesworthstone/franken_numpy", rev = ")[0-9a-f]{{40}}(".*$)'
              cargo, count = re.subn(pattern, rf'\g<1>{expected}\2', cargo, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"missing governed workspace dependency {package}")
          cargo_path.write_text(cargo, encoding="utf-8")

          suite_path = Path("SUITE.lock")
          suite = suite_path.read_text(encoding="utf-8")
          suite, count = re.subn(
              r'^franken_numpy\t[0-9a-f]{40}\t',
              f'franken_numpy\t{expected}\t',
              suite,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("SUITE.lock lacks exactly one franken_numpy repository row")
          suite_path.write_text(suite, encoding="utf-8")

          allow_path = Path("SUITE_ALLOWLIST.tsv")
          allow = allow_path.read_text(encoding="utf-8")
          row = (
              "fnp-random-core\t0.2.0\tgit+franken_numpy@SUITE.lock\t-\t-\t"
              "MIT+rider\tno\tno\tno\tno\tforbid\truntime\t"
              "fm-ai1: dependency-free SeedSequence and PCG64DXSM authority; no OS entropy, ndarray, rayon, or distribution surface; rev must equal the SUITE.lock franken_numpy pin\t"
              "fm\tsuite-lock-ritual\n"
          )
          retained = [line for line in allow.splitlines(keepends=True) if not line.startswith("fnp-random-core\t")]
          allow = "".join(retained)
          anchor = next(
              (line for line in allow.splitlines(keepends=True) if line.startswith("fnp-ndarray\t0.2.0\tgit+franken_numpy@SUITE.lock\t")),
              None,
          )
          if anchor is None:
              raise SystemExit("SUITE_ALLOWLIST.tsv lacks the fnp-ndarray anchor")
          allow_path.write_text(allow.replace(anchor, anchor + row, 1), encoding="utf-8")

          core_manifest = Path("crates/fmn-core/Cargo.toml").read_text(encoding="utf-8")
          if "fnp-random-core.workspace = true" not in core_manifest:
              raise SystemExit("fmn-core is not wired to fnp-random-core")
          rng = Path("crates/fmn-core/src/rng.rs").read_text(encoding="utf-8")
          for marker in ("pub use fnp_random_core::SeedSequence", "fnp_random_core::Pcg64Dxsm"):
              if marker not in rng:
                  raise SystemExit(f"fmn-core RNG wrapper lacks {marker!r}")
          PY
          cargo check -p fmn-core --all-targets
          cargo fmt --all
          git diff --check

      - name: Prove native vectors, state, closure, and wasm32 build
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p fmn-core
          cargo check --target wasm32-unknown-unknown -p fmn-core
          cargo test -p fmn-conformance --test governed_closure workspace_closure_is_exactly_the_governed_universe -- --exact
          cargo test -p fmn-conformance --test governed_closure git_dependencies_ride_their_suite_lock_pins -- --exact
          cargo test -p fmn-conformance --test governed_closure suite_lock_parses_and_matches_the_pinned_toolchain -- --exact
          cargo test -p fmn-conformance --test franken_numpy_pin
          cargo clippy -p fmn-core --all-targets -- -D warnings
          cargo clippy -p fmn-conformance --test franken_numpy_pin -- -D warnings

      - name: Rebuild and execute real browser surfaces
        shell: bash
        run: |
          set -euo pipefail
          timeout 3600 bash scripts/check_wasm_package.sh
          timeout 1800 bash wasm-smoke/run.sh

      - name: Refresh authority-bound evidence and project documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          def upsert(path: Path, start: str, end: str, body: str, *, append: bool = False) -> None:
              text = path.read_text(encoding="utf-8") if path.exists() else ""
              block = f"{start}\n{body.rstrip()}\n{end}"
              if start in text:
                  before, remainder = text.split(start, 1)
                  if end not in remainder:
                      raise SystemExit(f"unterminated generated block in {path}")
                  _, after = remainder.split(end, 1)
                  text = before.rstrip() + "\n\n" + block + after
              elif append or not text.startswith("#"):
                  text = text.rstrip() + "\n\n" + block + "\n"
              else:
                  newline = text.find("\n")
                  text = text[: newline + 1] + "\n" + block + "\n" + text[newline + 1 :].lstrip("\n")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text.rstrip() + "\n", encoding="utf-8")

          audit_path = Path("docs/wasm_audit.md")
          audit = audit_path.read_text(encoding="utf-8")
          lines = audit.splitlines()
          status = (
              "**Status:** re-derived 2026-09-04 after fm-ai1 moved NumPy-compatible SeedSequence and "
              "PCG64DXSM into FrankenNumPy's dependency-free `fnp-random-core` and made `fmn-core` consume "
              "that authority. The real wasm32 package build, fresh npm consumer/browser exercise, and "
              "Node smoke path passed on the exact source before this audit was refreshed; no host entropy, "
              "ndarray, Rayon, or full distribution engine entered the browser graph."
          )
          for index, line in enumerate(lines):
              if line.startswith("**Status:**"):
                  lines[index] = status
                  break
          else:
              raise SystemExit("docs/wasm_audit.md lacks a Status line")
          audit = "\n".join(lines) + "\n"
          for authority in ("SUITE.lock", "Cargo.lock"):
              digest = hashlib.sha256(Path(authority).read_bytes()).hexdigest()
              audit, count = re.subn(
                  rf'- `{re.escape(authority)}` SHA-256: `[0-9a-f]{{64}}`',
                  f'- `{authority}` SHA-256: `{digest}`',
                  audit,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"could not refresh the {authority} digest")
          census = "`fmn-wasm`, `fmn-anim`, `fmn-cache`, `fmn-codec`, `fmn-config`, `fmn-core`, `fmn-dmath`, `fmn-frame`, `fmn-geom`, `fmn-hash`, `fmn-mobject`, `fmn-platform`, `fmn-render`, `fmn-scene`"
          census_with_core = census + ", `fnp-random-core`"
          if census_with_core not in audit:
              if census not in audit:
                  raise SystemExit("could not locate the shipped wasm package census")
              audit = audit.replace(census, census_with_core, 1)
          paragraph = (
              "`fnp-random-core` enters the shipped serial and shared-memory graphs only through `fmn-core`. "
              "Its package manifest has no dependencies, its crate forbids unsafe code, and it exposes "
              "deterministic state transforms only. The wasm32 build and browser execution therefore exercise "
              "the same upstream PCG64DXSM state machine as the native engine without admitting `fnp-random`, "
              "host entropy, array storage, or a thread pool.\n\n"
          )
          if paragraph not in audit:
              anchor = "fmn-geom now enters with its doctrine-D4 solver gateway:"
              if anchor not in audit:
                  raise SystemExit("could not locate the wasm dependency explanation anchor")
              audit = audit.replace(anchor, paragraph + anchor, 1)
          old_absence = "| `franken_numpy`, `frankenscipy`, `franken_networkx`, `frankenpandas` | not consumed by the current wasm graph; any future subset requires its own target build and governed-closure update |"
          new_absence = "| the remainder of `franken_numpy` (`fnp-random`, arrays, linalg, I/O, and Python surfaces), plus `frankenscipy`, `franken_networkx`, and `frankenpandas` | not consumed by the current wasm graph; only dependency-free `fnp-random-core` is admitted through `fmn-core`, and any future subset requires its own target build and governed-closure update |"
          if old_absence in audit:
              audit = audit.replace(old_absence, new_absence, 1)
          elif new_absence not in audit:
              raise SystemExit("could not locate the intentionally-absent FrankenSuite row")
          audit_path.write_text(audit, encoding="utf-8")

          changelog = """## 2026-09-04 — FrankenNumPy RNG authority cutover

### Changed
- `fmn-core` delegates NumPy-compatible SeedSequence/PCG64DXSM state transitions to dependency-free `fnp-random-core`, while retaining named substreams, frame-keyed forks, and split-state journals.
- Every consumed `fnp-*` package resolves through one exact `SUITE.lock` source identity.

### Fixed
- The source-identity regression preserves legitimate multiple versions of unrelated Cargo packages while requiring each governed `fnp-*` package to resolve uniquely.

### Evidence
- The complete committed NumPy fixture covers SeedSequence words, raw draws, doubles, named streams, and frame indices above `u32::MAX`.
- Closure regressions prove the full `fnp-random`, ndarray, Rayon, and host-entropy surfaces do not enter `fmn-core`.
- Native, wasm32, packaged browser, Node smoke, and mandatory project gates ran before publication."""
          upsert(Path("CHANGELOG.md"), "<!-- fm-ai1-changelog:start -->", "<!-- fm-ai1-changelog:end -->", changelog)

          readme = """## Deterministic RNG authority

FrankenManim's scene-level contract is one explicit root seed, length-delimited UTF-8 named substreams, and pure `(substream, frame_index)` forks. NumPy-compatible SeedSequence mixing and PCG64DXSM state transitions are owned by the pinned, dependency-free `fnp-random-core` crate in FrankenNumPy. `fmn-core` wraps that primitive only to preserve split-state journals and the scene stream layout. Native and browser builds therefore share one implementation without importing the full distribution engine, OS entropy, ndarray storage, or Rayon.

The committed NumPy fixture covers SeedSequence output, raw words, doubles, named streams, and 64-bit frame indices. Permanent closure tests bind every consumed `fnp-*` package to the same `SUITE.lock` commit."""
          upsert(Path("README.md"), "<!-- fm-ai1-readme:start -->", "<!-- fm-ai1-readme:end -->", readme, append=True)

          candidates = [
              Path("IMPLEMENTATION_STATUS.md"),
              Path("docs/IMPLEMENTATION_STATUS.md"),
              Path("docs/implementation_status.md"),
              Path("docs/status.md"),
          ]
          status_path = next((candidate for candidate in candidates if candidate.exists()), candidates[1])
          implementation = """## fm-ai1: upstream deterministic RNG authority — complete

**Production behavior:** `fmn-core` delegates SeedSequence and PCG64DXSM to dependency-free `fnp-random-core`. Named substreams, pure frame-keyed forks, split-state restore, and `RNG_LAYOUT_VERSION = 1` remain stable.

**Earned evidence:** complete committed NumPy vectors; state round trips; native tests and warning-denied Clippy; wasm32 compilation; exact governed-source and zero-dependency regressions; packaged browser execution; Node smoke; mandatory project gate.

**Deliberate boundary:** unseeded entropy remains a platform capability supplied before `fmn-core`; the full `fnp-random` distribution engine is not part of the native or browser closure."""
          upsert(status_path, "<!-- fm-ai1-status:start -->", "<!-- fm-ai1-status:end -->", implementation, append=True)
          Path("artifacts/fm-ai1-ci/status-path.txt").write_text(str(status_path), encoding="utf-8")

          issues_path = Path(".beads/issues.jsonl")
          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          reason = (
              "Completed upstream RNG authority cutover: dependency-free fnp-random-core owns "
              "SeedSequence/PCG64DXSM; fmn-core preserves named substreams, frame forks, and journals; "
              "complete NumPy vectors, native/wasm builds, governed closure, browser package, Node smoke, "
              "and the mandatory gate passed before publication."
          )
          output = []
          found = False
          for line in issues_path.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              issue = json.loads(line)
              if issue.get("id") == "fm-ai1":
                  found = True
                  issue["status"] = "closed"
                  issue["updated_at"] = now
                  issue["closed_at"] = issue.get("closed_at") or now
                  issue["close_reason"] = reason
              output.append(json.dumps(issue, separators=(",", ":"), ensure_ascii=False))
          if not found:
              raise SystemExit("fm-ai1 is absent from .beads/issues.jsonl")
          issues_path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Run complete mandatory gate against refreshed evidence
        shell: bash
        run: |
          set -euo pipefail
          timeout 7200 bash scripts/check.sh

      - name: Write machine-readable acceptance receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          receipt = {
              "schema": "franken-manim.fm-ai1-completion.v1",
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "tested_base": os.environ["TESTED_BASE"],
              "franken_numpy_pin": os.environ["EXPECTED_FNP_PIN"],
              "rustc": Path("artifacts/fm-ai1-ci/rustc.txt").read_text(encoding="utf-8"),
              "authorities": {
                  "Cargo.toml": sha256("Cargo.toml"),
                  "Cargo.lock": sha256("Cargo.lock"),
                  "SUITE.lock": sha256("SUITE.lock"),
                  "SUITE_ALLOWLIST.tsv": sha256("SUITE_ALLOWLIST.tsv"),
                  "crates/fmn-core/src/rng.rs": sha256("crates/fmn-core/src/rng.rs"),
                  "crates/fmn-conformance/tests/franken_numpy_pin.rs": sha256("crates/fmn-conformance/tests/franken_numpy_pin.rs"),
              },
              "commands": [
                  "cargo test -p fmn-core",
                  "cargo check --target wasm32-unknown-unknown -p fmn-core",
                  "cargo test -p fmn-conformance --test governed_closure workspace_closure_is_exactly_the_governed_universe -- --exact",
                  "cargo test -p fmn-conformance --test franken_numpy_pin",
                  "cargo clippy -p fmn-core --all-targets -- -D warnings",
                  "bash scripts/check_wasm_package.sh",
                  "bash wasm-smoke/run.sh",
                  "bash scripts/check.sh",
              ],
              "verdict": "pass",
          }
          path = Path("artifacts/fm-ai1-completion.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Commit tested state and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          status_path="$(cat artifacts/fm-ai1-ci/status-path.txt)"
          rm -rf artifacts/fm-ai1-ci
          for workflow in \
            .github/workflows/fm-ai1-authority-verifier.yml \
            .github/workflows/converge-rng-authority-cutover.yml \
            .github/workflows/complete-rng-authority-cutover.yml \
            .github/workflows/finalize-rng-migration.yml; do
            [[ -e "$workflow" ]] && git rm -f "$workflow"
          done
          git add Cargo.toml Cargo.lock SUITE.lock SUITE_ALLOWLIST.tsv \
            crates/fmn-core/src/rng.rs crates/fmn-conformance/tests/franken_numpy_pin.rs \
            docs/wasm_audit.md README.md CHANGELOG.md "$status_path" \
            .beads/issues.jsonl artifacts/fm-ai1-completion.json
          git diff --cached --check
          git config user.name "FrankenManim FM-AI1 Verifier"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(core): complete upstream RNG authority cutover" \
            -m "Publish the exact governed lock, full-vector/source-identity regressions, real browser evidence, machine-readable acceptance receipt, accurate docs, and earned fm-ai1 closure after the complete gate passed."
          echo "CANDIDATE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish across unrelated main movement only
        shell: bash
        run: |
          set -euo pipefail
          critical=(
            Cargo.toml
            SUITE.lock
            crates/fmn-core/Cargo.toml
            crates/fmn-core/src/rng.rs
            crates/fmn-core/tests/rng_parity.rs
            crates/fmn-conformance/tests/franken_numpy_pin.rs
          )
          git diff --binary "$TESTED_BASE" "$CANDIDATE" -- \
            Cargo.lock SUITE_ALLOWLIST.tsv docs/wasm_audit.md README.md CHANGELOG.md \
            .beads/issues.jsonl artifacts/fm-ai1-completion.json \
            .github/workflows/fm-ai1-authority-verifier.yml \
            .github/workflows/converge-rng-authority-cutover.yml \
            .github/workflows/complete-rng-authority-cutover.yml \
            .github/workflows/finalize-rng-migration.yml \
            > /tmp/generated.patch
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main '+refs/heads/*:refs/remotes/origin/*' --prune
            latest="$(git rev-parse origin/main)"
            unchanged=1
            for path in "${critical[@]}"; do
              if ! git diff --quiet "$TESTED_BASE" "$latest" -- "$path"; then
                echo "cutover-critical file changed while evidence ran: $path" >&2
                unchanged=0
              fi
            done
            [[ "$unchanged" -eq 1 ]] || exit 20
            if [[ "$latest" != "$(git rev-parse HEAD^)" ]]; then
              git reset --hard "$latest"
              git apply --index --3way /tmp/generated.patch
              cargo check -p fmn-core --all-targets
              cargo test -p fmn-core
              cargo test -p fmn-conformance --test franken_numpy_pin
              cargo test -p fmn-conformance --test governed_closure workspace_closure_is_exactly_the_governed_universe -- --exact
              git config user.name "FrankenManim FM-AI1 Verifier"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "feat(core): complete upstream RNG authority cutover" \
                -m "Publish the exact governed lock, full-vector/source-identity regressions, real browser evidence, machine-readable acceptance receipt, accurate docs, and earned fm-ai1 closure after the complete gate passed."
            fi
            candidate="$(git rev-parse HEAD)"
            parent="$(git rev-parse HEAD^)"
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" == "$parent" ]]; then
              git push origin "$candidate:refs/heads/main"
              echo "FINAL_SHA=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "main moved during publication window; retrying ($attempt/8)"
          done
          exit 21

      - name: Reconcile canonical refs without deleting divergent work
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$FINAL_SHA"
          git push origin "$final_sha:refs/heads/master"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          while IFS= read -r branch; do
            case "$branch" in HEAD|main|master) continue;; esac
            ref="refs/remotes/origin/$branch"
            if ! git merge-base --is-ancestor "$ref" "$final_sha"; then
              echo "refusing to delete divergent branch $branch" >&2
              git log --oneline "$final_sha".."$ref" >&2
              exit 30
            fi
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)
          mapfile -t heads < <(git ls-remote --heads origin | awk '{name=$2; sub("^refs/heads/", "", name); print name}' | sort)
          [[ "${heads[*]}" == "main master" ]] || {
            printf 'unexpected live branches:\n  %s\n' "${heads[@]}" >&2
            exit 31
          }
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          master_sha="$(git ls-remote --heads origin refs/heads/master | awk '{print $1}')"
          [[ "$main_sha" == "$master_sha" && "$main_sha" == "$final_sha" ]] || {
            echo "canonical mirror mismatch: expected=$final_sha main=$main_sha master=$master_sha" >&2
            exit 32
          }

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fm-ai1-authority-verifier-failure-${{ github.run_id }}
          path: |
            artifacts/fm-ai1-ci
            Cargo.toml
            Cargo.lock
            SUITE.lock
            SUITE_ALLOWLIST.tsv
            crates/fmn-core/src/rng.rs
            crates/fmn-conformance/tests/franken_numpy_pin.rs
            docs/wasm_audit.md
          if-no-files-found: warn
          retention-days: 14
