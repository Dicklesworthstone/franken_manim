name: Native project CLI

on:
  push:
    branches: [main]
    paths:
      - 'crates/fmn-cli/src/main.rs'
      - 'crates/fmn-cli/src/studio_project.rs'
      - 'crates/fmn-cli/src/studio_project/**'
      - 'crates/fmn-studio/src/project*'
      - 'crates/fmn-studio/src/project/**'
      - '.github/workflows/native-project-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the repository-pinned toolchain
        run: rustup show active-toolchain
      - name: Check the tracked source's formatting
        # The tracked file and its out-of-line modules, so a misformatted push fails here.
        run: rustfmt --edition 2024 --check crates/fmn-cli/src/studio_project.rs
      - name: Compile the shipping binary and run native-project tests
        run: cargo test --locked -p fmn-cli --features batch --bin fmn studio_project::tests
