name: Studio saved sessions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-sessions.yml'
      - 'scripts/patches/studio-session-*.patch'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-sessions
  cancel-in-progress: false
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_TARGET_DIR: target/portable
  PYO3_PYTHON: python
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - run: |
          rustup show active-toolchain
          python -m pip install numpy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-portable-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Integrate typed native input without weakening custom-command barriers
        run: |
          if ! grep -q 'frame-stamped-native-input-track-v2' crates/fmn-studio/src/native/service.rs; then
            git apply --check scripts/patches/studio-session-typed-input.patch
            git apply scripts/patches/studio-session-typed-input.patch
          fi
          rustfmt --edition 2024 --config skip_children=true crates/fmn-scene/src/journal.rs crates/fmn-scene/tests/journal.rs crates/fmn-studio/src/protocol.rs crates/fmn-studio/src/native/edits.rs crates/fmn-studio/src/native/service.rs crates/fmn-studio/src/native/service/pending.rs crates/fmn-studio/src/native/service/recovery.rs crates/fmn-studio/tests/native_committed_input.rs crates/fmn-conformance/tests/e2e_scenarios.rs
          git diff --check
      - name: Verify native input, versioned sessions and recovery
        run: |
          cargo test --locked -p fmn-scene --test journal --test runtime
          cargo test --locked -p fmn-studio --lib
          cargo test --locked -p fmn-studio --test supervisor --test protocol --test native_committed_input --test native_worker --test native_deferred_worker
          cargo test --locked -p fmn-cli --features cli,batch --lib studio_
          cargo test --locked -p fmn-conformance --test e2e_scenarios studio_native_ -- --nocapture
          cargo clippy --locked -p fmn-studio --lib -- -D warnings
          node --test crates/fmn-studio/tests/input_queue.mjs
      - name: Commit validated typed input integration to main
        run: |
          git add crates/fmn-scene/src/journal.rs crates/fmn-scene/tests/journal.rs crates/fmn-studio/src/protocol.rs crates/fmn-studio/src/native/edits.rs crates/fmn-studio/src/native/service.rs crates/fmn-studio/src/native/service/pending.rs crates/fmn-studio/src/native/service/recovery.rs crates/fmn-studio/tests/native_committed_input.rs crates/fmn-studio/tests/browser.mjs crates/fmn-conformance/tests/e2e_scenarios.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(studio): preserve typed input replayability in saved and restarted sessions'
            git fetch origin main
            git merge --no-edit origin/main
            git push origin HEAD:main
          fi
          git rev-parse HEAD > /tmp/session-source-sha.txt
          git archive --format=tar.gz HEAD > /tmp/session-source.tar.gz
      - name: Prove browser download and two whole-host restarts retain editable native state
        run: |
          cargo build --locked -p fmn-cli --features cli,batch --bin fmn
          node crates/fmn-studio/tests/browser.mjs "$PWD/target/portable/debug/fmn" "$RUNNER_TEMP/saved-session-browser"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-session-evidence-${{ github.sha }}
          path: |
            /tmp/session-source-sha.txt
            /tmp/session-source.tar.gz
            ${{ runner.temp }}/saved-session-browser
          retention-days: 1
          if-no-files-found: warn
