name: Portal playback selection integration

on:
  push:
    branches: [main]
    paths: [".github/workflows/portal-playback-selection.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-playback-selection
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TARGET_DIR: target/portable
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Install the governed toolchain
        run: rustup show active-toolchain
      - name: Apply the reviewed native bridge patch
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^mod portal_playback;' crates/fmn-python/src/lib.rs; then
            git apply --check scripts/patches/portal-playback-selection.patch
            git apply scripts/patches/portal-playback-selection.patch
          fi
          rustfmt --edition 2024 --config skip_children=true \
            crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_playback.rs \
            crates/fmn-scene/src/runtime.rs
          git diff --check
          git add crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_playback.rs crates/fmn-scene/src/runtime.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(python): honor native skip/range playback and rebase selected soundtracks (fm-5wq.4.145)'
            git fetch origin main
            git merge --no-edit origin/main
            git push origin HEAD:main
          fi
          echo "Validated source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-portable-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install host NumPy
        run: python3 -m pip install --user --break-system-packages numpy
      - name: Exercise actual native playback and decoded outputs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-python portal_playback -- --nocapture
          cargo test --locked -p fmn-python production_native_output_acceptance_suite -- --nocapture
          cargo test --locked -p fmn-scene --test runtime
