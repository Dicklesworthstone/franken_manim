name: Native text-matching regressions

on:
  push:
    branches: [main]
    paths:
      - "crates/fmn-library/src/text_matching.rs"
      - "crates/fmn-library/src/text_matching/**"
      - "crates/fmn-library/tests/text_matching*.rs"
      - ".github/workflows/native-text-matching-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-text-matching-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_TARGET_DIR: target/portable
  RUST_BACKTRACE: "1"

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3c0adef952cc607b2ea0bc6d074e8386dd25dada
          persist-credentials: false
      - name: Install repository-pinned toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: native-text-matching-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-portable-
      - name: Prepare exact formatted candidate sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/text-matching-evidence
          git rev-parse HEAD > /tmp/text-matching-evidence/source-sha.txt
          rustfmt --edition 2024 crates/fmn-library/src/text_matching.rs crates/fmn-library/tests/text_matching_overrides.rs
          cp --parents crates/fmn-library/src/text_matching.rs crates/fmn-library/src/text_matching/selection.rs crates/fmn-library/tests/text_matching_overrides.rs /tmp/text-matching-evidence/
          git diff --check
      - name: Native matching unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-library --lib text_matching 2>&1 | tee /tmp/text-matching-evidence/unit.log
      - name: Native matching integration tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-library --test text_matching --test text_matching_overrides 2>&1 | tee /tmp/text-matching-evidence/integration.log
      - name: Warning-denied native matching lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p fmn-library --lib --test text_matching --test text_matching_overrides -- -D warnings 2>&1 | tee /tmp/text-matching-evidence/clippy.log
      - name: Retain exact sources and terminal evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-text-matching-${{ github.sha }}
          path: /tmp/text-matching-evidence/
          if-no-files-found: error
          retention-days: 7
