name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # R22's full SIMD build-tier matrix.
    - cron: "23 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  portable:
    name: check (portable, linux-x86-64)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/portable
    steps:
      - uses: actions/checkout@v4

      # rustup resolves the exact toolchain from rust-toolchain.toml; no
      # floating "nightly" ever runs in CI.
      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-portable-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Run the mandatory gate
        run: bash scripts/check.sh

  x86-64-v3:
    name: check (x86-64-v3)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/x86-64-v3
      RUSTFLAGS: -C target-feature=+avx2,+bmi2,+fma
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Verify runner ISA
        run: |
          for feature in avx2 bmi2 fma; do
            grep -m1 -qw "$feature" /proc/cpuinfo || {
              echo "runner lacks required x86-64-v3 feature: $feature" >&2
              exit 1
            }
          done

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86-64-v3
          key: cargo-${{ runner.os }}-${{ runner.arch }}-x86-64-v3-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Run the mandatory gate
        run: bash scripts/check.sh

  x86-64-v4:
    name: weekly check (x86-64-v4, qemu)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_DIR: target/x86-64-v4
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: qemu-x86_64 -cpu max -L /
      FMN_SIMD_TIER_GATE: "1"
      RUSTFLAGS: -C target-feature=+avx512f,+avx512bw,+avx512dq,+avx512vl
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Install and fingerprint x86-64 emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user
          qemu-x86_64 --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86-64-v4
          key: cargo-${{ runner.os }}-${{ runner.arch }}-x86-64-v4-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Compile the workspace and run the SIMD tier gate
        run: bash scripts/check.sh

  aarch64-neon:
    name: weekly check (aarch64-neon)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_TARGET_DIR: target/aarch64-neon
      RUSTFLAGS: -C target-feature=+neon
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-neon
          key: cargo-${{ runner.os }}-${{ runner.arch }}-aarch64-neon-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Run the mandatory gate
        run: bash scripts/check.sh
