name: FM AI1 PDF Attestor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fm-ai1-pdf-attestor.yml"
      - "artifacts/fm-ai1-completion.json"
  workflow_dispatch:
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"

permissions:
  contents: write

concurrency:
  group: fm-ai1-pdf-attestor
  cancel-in-progress: false

jobs:
  attest:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Check whether the earned completion state exists
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          receipt_path = Path("artifacts/fm-ai1-completion.json")
          if not receipt_path.exists():
              Path("/tmp/ready").write_text("no\n", encoding="utf-8")
              raise SystemExit(0)
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("verdict") != "pass":
              raise SystemExit("completion receipt is not a pass")
          issues = [json.loads(line) for line in Path(".beads/issues.jsonl").read_text(encoding="utf-8").splitlines() if line]
          bead = next((issue for issue in issues if issue.get("id") == "fm-ai1"), None)
          if bead is None or bead.get("status") != "closed":
              raise SystemExit("fm-ai1 completion receipt exists but bead is not closed")
          if "<!-- fm-ai1-readme:start -->" not in Path("README.md").read_text(encoding="utf-8"):
              raise SystemExit("README completion marker missing")
          if "<!-- fm-ai1-changelog:start -->" not in Path("CHANGELOG.md").read_text(encoding="utf-8"):
              raise SystemExit("CHANGELOG completion marker missing")
          status_paths = [Path("IMPLEMENTATION_STATUS.md"), Path("docs/IMPLEMENTATION_STATUS.md"), Path("docs/implementation_status.md"), Path("docs/status.md")]
          if not any(path.exists() and "<!-- fm-ai1-status:start -->" in path.read_text(encoding="utf-8") for path in status_paths):
              raise SystemExit("implementation status marker missing")
          suite = Path("SUITE.lock").read_text(encoding="utf-8")
          rows = [line for line in suite.splitlines() if line.startswith("franken_numpy\t")]
          if len(rows) != 1:
              raise SystemExit("invalid franken_numpy SUITE.lock cardinality")
          pin = rows[0].split("\t", 2)[1]
          if re.fullmatch(r"[0-9a-f]{40}", pin) is None or receipt.get("franken_numpy_pin") != pin:
              raise SystemExit("receipt and governed FrankenNumPy pin disagree")
          Path("/tmp/pin").write_text(pin + "\n", encoding="utf-8")
          Path("/tmp/ready").write_text("yes\n", encoding="utf-8")
          PY
          echo "state=$(cat /tmp/ready)" >> "$GITHUB_OUTPUT"

      - name: Leave no success artifact before completion
        if: steps.ready.outputs.state == 'no'
        run: echo "fm-ai1 is not yet in its earned committed completion state; scheduled retry remains active."

      - name: Install governed toolchain
        if: steps.ready.outputs.state == 'yes'
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-05 --profile minimal --target wasm32-unknown-unknown
          rustup override set nightly-2026-07-05

      - name: Independently exercise focused locked gates
        if: steps.ready.outputs.state == 'yes'
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-core
          cargo check --locked --target wasm32-unknown-unknown -p fmn-core
          cargo test --locked -p fmn-conformance --test franken_numpy_pin
          cargo test --locked -p fmn-conformance --test governed_closure workspace_closure_is_exactly_the_governed_universe -- --exact

      - name: Require the exact canonical branch state
        if: steps.ready.outputs.state == 'yes'
        run: |
          set -euo pipefail
          mapfile -t heads < <(git ls-remote --heads origin | awk '{name=$2; sub("^refs/heads/", "", name); print name}' | sort)
          [[ "${heads[*]}" == "main master" ]] || exit 10
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          master_sha="$(git ls-remote --heads origin refs/heads/master | awk '{print $1}')"
          [[ "$main_sha" == "$master_sha" && "$main_sha" == "$(git rev-parse HEAD)" ]] || exit 11

      - name: Generate minimal PDF attestation
        if: steps.ready.outputs.state == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          main = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          pin = Path("/tmp/pin").read_text(encoding="utf-8").strip()
          timestamp = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          lines = [
              "FrankenManim FM-AI1 Live Attestation: PASS",
              f"Live main/master: {main}",
              f"FrankenNumPy pin: {pin}",
              f"Attested: {timestamp}",
              "Focused locked native, wasm32, source-identity, and governed-closure gates passed.",
          ]
          def esc(value: str) -> str:
              return value.replace("\\", "\\\\").replace("(", "\\(").replace(")", "\\)")
          commands = ["BT", "/F1 15 Tf", "72 720 Td"]
          for index, line in enumerate(lines):
              if index:
                  commands.append("0 -28 Td")
              commands.append(f"({esc(line)}) Tj")
          commands.append("ET")
          stream = "\n".join(commands).encode("ascii")
          objects = [
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>",
              b"<< /Length " + str(len(stream)).encode("ascii") + b" >>\nstream\n" + stream + b"\nendstream",
              b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
          ]
          pdf = bytearray(b"%PDF-1.4\n%\xe2\xe3\xcf\xd3\n")
          offsets = [0]
          for number, body in enumerate(objects, 1):
              offsets.append(len(pdf))
              pdf.extend(f"{number} 0 obj\n".encode("ascii"))
              pdf.extend(body)
              pdf.extend(b"\nendobj\n")
          xref = len(pdf)
          pdf.extend(f"xref\n0 {len(objects)+1}\n".encode("ascii"))
          pdf.extend(b"0000000000 65535 f \n")
          for offset in offsets[1:]:
              pdf.extend(f"{offset:010d} 00000 n \n".encode("ascii"))
          pdf.extend(f"trailer\n<< /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n".encode("ascii"))
          path = Path("artifacts/fm-ai1-live-attestation.pdf")
          path.write_bytes(pdf)
          Path("artifacts/fm-ai1-live-pdf.json").write_text(json.dumps({
              "schema": "franken-manim.fm-ai1-live-pdf.v1",
              "live_main_master": main,
              "franken_numpy_pin": pin,
              "attested_at": timestamp,
              "verdict": "pass",
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Publish the PDF and self-remove
        if: steps.ready.outputs.state == 'yes'
        run: |
          set -euo pipefail
          git rm -f .github/workflows/fm-ai1-pdf-attestor.yml
          git add artifacts/fm-ai1-live-attestation.pdf artifacts/fm-ai1-live-pdf.json
          git diff --cached --check
          git config user.name "FrankenManim FM-AI1 PDF Attestor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(core): publish live RNG cutover attestation" \
            -m "Independently re-run focused locked gates and emit a renderable PDF only after the receipt, bead, docs, governed pin, and exact main/master state agree."
          final_sha="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$parent" ]] || exit 12
          git push origin "$final_sha:refs/heads/main"
          git push origin "$final_sha:refs/heads/master"
