name: Complex decimal authoring
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complex-decimal-authoring.yml'
      - 'scripts/patches/complex-decimal-activation.patch'
      - 'crates/fmn-python/python/fmn_python/decimal_authoring.py'
      - 'crates/fmn-python/tests/decimal_authoring.py'
      - 'crates/fmn-python/python/fmn_python/matrix.py'
      - 'crates/fmn-python/tests/complex_matrix.py'
      - 'crates/fmn-python/tests/complex_readouts_render.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: complex-decimal-authoring
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/camera-runtime
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/camera-runtime
          key: camera-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
      - name: Activate readouts and replace obsolete refusal expectations
        run: |
          set -euo pipefail
          patch=scripts/patches/complex-decimal-activation.patch
          for path in crates/fmn-python/python/fmn_python/initialization.py crates/fmn-python/tests/bridge.py; do
            if git apply --check --include="$path" "$patch"; then
              git apply --include="$path" "$patch"
            else
              git apply --reverse --check --include="$path" "$patch"
            fi
          done
          python - <<'PYCODE'
          from pathlib import Path
          path = Path("scripts/check_portal_runtime.sh")
          text = path.read_text()
          marker = "for suite in "
          required = ("decimal_authoring", "complex_matrix", "complex_readouts_render")
          start = text.index(marker) + len(marker)
          end = text.index("; do", start)
          current = text[start:end].split()
          missing = [suite for suite in required if suite not in current]
          if missing:
              text = text[:start] + " ".join(missing + current) + text[end:]
              path.write_text(text)
          PYCODE
          git diff --check
          rustup show active-toolchain
      - name: Build the current native wheel and run readout regressions
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1'
          python -m maturin build --locked --interpreter python --profile dev --out target/complex-decimal-wheel 2>&1 | tee /tmp/complex-decimal-build.log
          python -m venv target/complex-decimal-venv
          target/complex-decimal-venv/bin/python -m pip install 'numpy==2.5.2' target/complex-decimal-wheel/*.whl
          for suite in decimal_authoring complex_matrix matrix_authoring live_tex live_tex_render complex_readouts_render; do
            target/complex-decimal-venv/bin/python -I crates/fmn-python/tests/$suite.py 2>&1 | tee /tmp/complex-decimal-$suite.log
          done
      - name: Publish verified activation directly to main
        run: |
          set -euo pipefail
          git add crates/fmn-python/python/fmn_python/initialization.py crates/fmn-python/tests/bridge.py scripts/check_portal_runtime.sh
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(python): activate native-backed complex readouts and replace obsolete refusals'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Preserve exact source and validation evidence
        if: always()
        run: |
          git rev-parse HEAD > /tmp/complex-decimal-source-sha.txt
          git diff > /tmp/complex-decimal-working.patch
          git archive --format=tar.gz HEAD > /tmp/complex-decimal-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complex-decimal-${{ github.sha }}
          path: |
            /tmp/complex-decimal-*
            target/complex-decimal-wheel/*.whl
          retention-days: 3
