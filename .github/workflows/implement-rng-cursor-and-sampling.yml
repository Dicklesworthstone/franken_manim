                  let bounds = [1_u64, 2, 3, 7, 10, 255, 256, 257, 65_537, u64::MAX];
                  for &bound in &bounds {
                      let mut generator = Pcg64Dxsm::from_seed(bound);
                      for _ in 0..20_000 {
                          let value = generator.uniform_below(bound).expect("bounded sample");
                          assert!(value < bound, "{value} escaped upper bound {bound}");
