                  let mut left = Pcg64Dxsm::from_seed(9);
                  let mut right = Pcg64Dxsm::from_seed(9);
                  for _ in 0..10_000 {
                      let a = left.uniform_range(17..1_000_003).expect("left range");
                      let b = right.uniform_range(17..1_000_003).expect("right range");
                      assert_eq!(a, b);
                      assert!((17..1_000_003).contains(&a));
                  }
                  assert_eq!(
