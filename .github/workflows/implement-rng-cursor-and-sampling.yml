                  let original: Vec<u32> = (0..4_096).collect();
                  let mut left = original.clone();
                  let mut right = original.clone();
                  Pcg64Dxsm::from_seed(777)
                      .shuffle(&mut left)
                      .expect("left shuffle");
                  Pcg64Dxsm::from_seed(777)
                      .shuffle(&mut right)
                      .expect("right shuffle");
                  assert_eq!(left, right);
                  assert_ne!(left, original);
                  left.sort_unstable();
                  assert_eq!(left, original);
              }

              #[test]
