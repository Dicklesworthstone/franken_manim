                  let mut values: Vec<u32> = (0..1_000).collect();
                  let sample = Pcg64Dxsm::from_seed(314)
                      .sample_prefix(&mut values, 250)
                      .expect("sample prefix");
                  let mut sorted = sample.to_vec();
                  sorted.sort_unstable();
                  sorted.dedup();
                  assert_eq!(sorted.len(), 250);
                  assert!(sorted.iter().all(|value| *value < 1_000));

                  let before = values.clone();
                  assert_eq!(
                      Pcg64Dxsm::from_seed(314).sample_prefix(&mut values, 1_001),
                      Err(RngRangeError::SampleTooLarge {
                          requested: 1_001,
                          population: 1_000
                      })
                  );
                  assert_eq!(values, before);
              }

              #[test]
              fn empty_and_singleton_shuffle_consume_no_words() {
                  let mut generator = Pcg64Dxsm::from_seed(88);
                  let before = generator.state();
                  let mut empty: [u8; 0] = [];
                  let mut singleton = [7_u8];
                  generator.shuffle(&mut empty).expect("empty shuffle");
                  generator
                      .shuffle(&mut singleton)
                      .expect("singleton shuffle");
                  assert_eq!(generator.state(), before);
                  assert_eq!(singleton, [7]);
              }
          }
