                  let mut sampled = Pcg64Dxsm::from_seed(123);
                  let mut raw = Pcg64Dxsm::from_seed(123);
                  for bits in 1..64 {
                      let upper = 1_u64 << bits;
                      let word = raw.next_u64();
                      let expected = word >> (64 - bits);
                      assert_eq!(sampled.uniform_below(upper), Ok(expected));
                  }
              }

