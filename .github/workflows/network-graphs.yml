name: Native network graphs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-graphs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-network-graphs
  cancel-in-progress: false
jobs:
  network:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/camera-runtime
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - name: Prepare exact native network implementation
        run: |
          set -euo pipefail
          git fetch origin 511379e5732a7f34b4f0c2749cd9115610d72952
          git show 511379e5732a7f34b4f0c2749cd9115610d72952:native-network.patch > /tmp/network.patch
          test "$(git hash-object /tmp/network.patch)" = 5c002b7649f9c3503c145b23803d091f36a3fb4b
          git apply --check /tmp/network.patch
          git apply /tmp/network.patch
          for path in crates/fmn-python/src/portal_network.rs crates/fmn-python/tests/native_network_layout.py; do
            test ! -e "$path"
            git show "511379e5732a7f34b4f0c2749cd9115610d72952:$path" > "$path"
          done
          rustfmt --edition 2024 crates/fmn-library/src/network_graph.rs crates/fmn-library/tests/network_graph.rs crates/fmn-python/src/portal_network.rs
          git diff --check
          git add crates/fmn-library/src/network_graph.rs crates/fmn-library/tests/network_graph.rs crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_network.rs crates/fmn-python/tests/native_network_layout.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Candidate: native network authoring bridge'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/camera-runtime
          key: camera-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SUITE.lock') }}
      - name: Native layout and graph regressions
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.5.2' 'maturin==1.14.1'
          cargo test --locked -p fmn-library --test network_graph 2>&1 | tee /tmp/network-native.log
          cargo clippy --locked -p fmn-library --all-targets -- -D warnings 2>&1 | tee /tmp/network-clippy.log
          cargo test --locked -p fmn-python --lib portal_network::tests -- --nocapture 2>&1 | tee /tmp/network-embedded.log
          cargo clippy --locked -p fmn-python --lib -- -D warnings 2>&1 | tee /tmp/network-portal-clippy.log
      - name: Build and exercise the installed native wheel
        run: |
          set -euo pipefail
          python -m maturin build --locked --interpreter python --profile dev --out target/network-wheel 2>&1 | tee /tmp/network-build.log
          python -m venv target/network-venv
          target/network-venv/bin/python -m pip install 'numpy==2.5.2' target/network-wheel/*.whl
          target/network-venv/bin/python -I crates/fmn-python/tests/native_network_layout.py 2>&1 | tee /tmp/network-installed.log
      - name: Stage tested immutable blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          paths = ['crates/fmn-library/src/network_graph.rs', 'crates/fmn-library/tests/network_graph.rs',
                   'crates/fmn-python/src/lib.rs', 'crates/fmn-python/src/portal_network.rs',
                   'crates/fmn-python/tests/native_network_layout.py']
          blobs = {}
          for path in paths:
              body = json.dumps({'content': pathlib.Path(path).read_text(), 'encoding': 'utf-8'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  data=body, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                    'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  blobs[path] = json.load(response)['sha']
          pathlib.Path('/tmp/network-tested-blobs.json').write_text(json.dumps(
              {'base_commit': os.environ['GITHUB_SHA'], 'blobs': blobs}, indent=2) + '\n')
          print(pathlib.Path('/tmp/network-tested-blobs.json').read_text())
          PY
      - name: Preserve exact source and evidence
        if: always()
        run: |
          git rev-parse HEAD > /tmp/network-source-sha.txt
          git diff > /tmp/network-working.patch
          git archive --format=tar.gz HEAD > /tmp/network-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-network-${{ github.run_id }}
          path: |
            /tmp/network*
            target/network-wheel/*.whl
          retention-days: 3
