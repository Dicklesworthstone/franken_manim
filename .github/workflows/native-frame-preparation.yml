name: Native frame preparation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-frame-preparation.yml']
  workflow_dispatch:
# Validate immutable candidates; only the GitHub connector publishes refs.
permissions:
  contents: write
concurrency:
  group: native-frame-preparation-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Dicklesworthstone/franken_manim' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: target/portable
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3a09cee2743559ebf96dafd155f41d06678005f1
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: native-prepare-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-portable-
            fmtl-rates-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify and apply native pipeline and camera candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-prepare'
          out.mkdir()
          candidates = [
              ('910f528ef983d6b572b38d93a746141806898a46', '42617a799fda81f5502f9a7defaab5d745f1392f9d3a031be035808750f5d2c1'),
              ('2edf5665aeb7f337c355e0ca705dcb80237daf9f', '158530940196026ffd5ec76019ba76dbef818b80a59f9127e063747fa869ae93'),
          ]
          allowed = {
              'crates/fmn/src/rendering/pipeline.rs', 'crates/fmn/src/rendering.rs',
              'crates/fmn/tests/native_preparation.rs',
              'crates/fmn-cli/src/offline_cpu.rs', 'crates/fmn-cli/src/lib.rs',
              'crates/fmn-mobject/src/dynamics.rs', 'crates/fmn-mobject/src/stage.rs',
              'crates/fmn-mobject/tests/snapshot_reads.rs',
              'crates/fmn-scene/src/camera_rig.rs', 'crates/fmn-scene/tests/camera_snapshot.rs',
              'crates/fmn/src/rendering/camera_animation.rs',
          }
          names = set()
          for index, (sha, expected) in enumerate(candidates):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=60) as response:
                  content = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest() == sha
              patch = gzip.decompress(base64.b64decode(content, validate=True))
              assert hashlib.sha256(patch).hexdigest() == expected
              path = out / f'candidate-{index}.patch'
              path.write_bytes(patch)
              stats = subprocess.check_output(['git','apply','--numstat',str(path)], text=True)
              paths = {line.split('\t',2)[2] for line in stats.splitlines()}
              assert paths and paths <= allowed, paths
              subprocess.run(['git','apply','--check',str(path)], check=True)
              subprocess.run(['git','apply',str(path)], check=True)
              names |= paths
          assert names == allowed, names
          paths = sorted(names)
          subprocess.run(['rustfmt','--edition','2024','--config','skip_children=true',*paths], check=True)
          subprocess.run(['git','add','-N','--',*paths], check=True)
          subprocess.run(['git','diff','--check'], check=True)
          assert set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()) == allowed
          for name in paths:
              target = out / 'candidate-source' / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(pathlib.Path(name).read_bytes())
          (out / 'paths.json').write_text(json.dumps(paths))
          (out / 'base.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          (out / 'validation-commit.txt').write_text(os.environ['GITHUB_SHA'])
          (out / 'patches.json').write_text(json.dumps(candidates))
          PY
      - name: Test snapshot ownership and camera sampling
        run: |
          set -o pipefail
          {
            cargo test --locked -p fmn-mobject --test snapshot_reads --test frozen_render &&
            cargo test --locked -p fmn-anim --test render_handoff --test frame_order &&
            cargo test --locked -p fmn-scene --test camera_snapshot
          } 2>&1 | tee "$RUNNER_TEMP/native-prepare/ownership-tests.log"
      - name: Test native rendering and frame pipeline
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --locked -p fmn --all-targets --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/native-prepare/native-tests.log"
      - name: Test real CLI CPU camera and compiled pipelines
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --locked -p fmn-cli --features cli,batch --lib --test cpu_pipeline --test camera_pipeline --test compiled_pipeline --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/native-prepare/cli-tests.log"
      - name: Check workspace integration
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo check --locked --workspace 2>&1 | tee "$RUNNER_TEMP/native-prepare/workspace-check.log"
      - name: Clippy for changed production crates and tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo clippy --locked -p fmn-mobject -p fmn-scene -p fmn -p fmn-cli --features fmn-cli/cli,fmn-cli/batch --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/native-prepare/clippy.log"
      - name: Archive exact validated source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-prepare'
          entries = []
          for name in json.loads((out / 'paths.json').read_text()):
              content = pathlib.Path(name).read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',
                  data=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  assert json.load(response)['sha'] == expected
              entries.append({'path':name,'mode':'100644','type':'blob','sha':expected})
          manifest = {'base':(out / 'base.txt').read_text(), 'validation_commit':os.environ['GITHUB_SHA'], 'patches':json.loads((out / 'patches.json').read_text()), 'files':entries}
          (out / 'validated-blobs.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/native-prepare
          if-no-files-found: error
          retention-days: 7
