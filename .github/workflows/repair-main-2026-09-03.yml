name: Repair main 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-main-2026-09-03.yml

permissions:
  contents: write

concurrency:
  group: repair-main-2026-09-03
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve claim postcondition error precedence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/agent_claim.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          graph_line = "            after_graph_sha256 = agent_claim_guard.graph_digest(after)\n"
          broad_catch = "        except (agent_brief.BriefError, agent_claim_guard.GuardError) as exc:\n"
          narrow_catch = "        except agent_brief.BriefError as exc:\n"
          claim_start = "        claim_delta = _verify_claim_only_delta(\n"

          if lines.count(graph_line) != 1:
              raise SystemExit("expected exactly one post-claim graph digest")
          if lines.count(broad_catch) != 1:
              raise SystemExit("expected exactly one broad post-claim catch")
          if lines.count(claim_start) != 1:
              raise SystemExit("expected exactly one claim-delta call")

          lines.remove(graph_line)
          lines[lines.index(broad_catch)] = narrow_catch
          claim_index = lines.index(claim_start)
          lines[claim_index:claim_index] = [
              "        # Prove the narrow transaction shape before authenticating the whole graph.\n",
              "        # Otherwise broader task-semantic drift can mask the precise membership,\n",
              "        # unrelated-issue, or target-field contradiction that actually occurred.\n",
          ]
          claim_index = lines.index(claim_start)
          claim_end = next(
              index
              for index in range(claim_index + 1, len(lines))
              if lines[index] == "        )\n"
          )
          lines[claim_end + 1:claim_end + 1] = [
              "        try:\n",
              "            after_graph_sha256 = agent_claim_guard.graph_digest(after)\n",
              "        except agent_claim_guard.GuardError as exc:\n",
              "            raise ClaimError(f\"post-claim ledger verification failed: {exc}\", 5) from exc\n",
          ]
          path.write_text("".join(lines), encoding="utf-8")
          PY
          python3 -m py_compile scripts/agent_claim.py scripts/test_agent_claim.py
          python3 scripts/test_agent_claim.py
          python3 scripts/test_agent_claim_guard.py
          git diff --check
          git config user.name "Jeff Emanuel"
          git config user.email "35050222+Dicklesworthstone@users.noreply.github.com"
          git add scripts/agent_claim.py
          git commit -m "fix(agent): preserve claim postcondition precedence" -m "Validate the exact claim-only ledger delta before authenticating the complete task-semantic graph. Concurrent membership, unrelated-issue, and target-field drift retain their precise failures while semantic-only drift still fails closed." -m "Relates-to: fm-5wq.4.141"
          git push origin HEAD:main

      - name: Restore rustfmt conformance and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git rm .github/workflows/repair-main-2026-09-03.yml
          git add -u
          git commit -m "style(rust): restore workspace rustfmt conformance" -m "Apply the pinned formatter to the Rust sources currently rejected by the platform gates and remove the completed one-shot repair workflow." -m "Relates-to: fm-5wq.4.141"
          git push origin HEAD:main
