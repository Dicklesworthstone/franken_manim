name: Canonical branches

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * *"

permissions:
  contents: write

concurrency:
  group: canonical-branches
  cancel-in-progress: true

jobs:
  enforce:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Mirror main to master and remove every other branch
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          converged=0
          for _ in 1 2 3 4 5; do
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            main_sha="$(git rev-parse refs/remotes/origin/main)"
            git push origin "${main_sha}:refs/heads/master"

            current_main="$(git ls-remote --heads origin refs/heads/main | cut -f1)"
            current_master="$(git ls-remote --heads origin refs/heads/master | cut -f1)"
            if [[ -n "${current_main}" && "${current_main}" == "${current_master}" ]]; then
              converged=1
              break
            fi
          done
          if [[ "${converged}" -ne 1 ]]; then
            echo "main and master did not converge after five attempts" >&2
            exit 1
          fi

          while IFS=$'\t' read -r _ ref; do
            case "${ref}" in
              refs/heads/main|refs/heads/master) continue ;;
            esac
            git push origin ":${ref}"
          done < <(git ls-remote --heads origin | LC_ALL=C sort -k2,2)

          mapfile -t remaining < <(git ls-remote --heads origin | LC_ALL=C sort -k2,2)
          if [[ "${#remaining[@]}" -ne 2 ]]; then
            printf 'unexpected branch set after cleanup:\n%s\n' "${remaining[*]}" >&2
            exit 1
          fi
          main_sha="$(git ls-remote --heads origin refs/heads/main | cut -f1)"
          master_sha="$(git ls-remote --heads origin refs/heads/master | cut -f1)"
          if [[ -z "${main_sha}" || "${main_sha}" != "${master_sha}" ]]; then
            echo "main/master mirror invariant failed" >&2
            exit 1
          fi
