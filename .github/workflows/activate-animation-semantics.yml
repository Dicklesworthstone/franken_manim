# One-shot activation; the final successful job deletes this workflow.
name: Activate Animation semantics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-animation-semantics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activate-animation-semantics
  cancel-in-progress: true

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Patch the embedded loader and test harness
        run: python scripts/activate_animation_semantics.py
      - name: Validate Python sources
        run: |
          python -m py_compile scripts/activate_animation_semantics.py
          python -m py_compile crates/fmn-python/python/animation_semantics.py
          python -m py_compile crates/fmn-python/tests/animation_semantics.py
          git diff --check
      - name: Format and test
        run: |
          cargo fmt --all
          git diff --check
          cargo test --locked -p fmn-python
          cargo test --locked -p fmn-conformance
      - name: Commit activation
        run: |
          git config user.name "FrankenManim Animation Semantics"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/fmn-python/src/lib.rs
          git rm .github/workflows/activate-animation-semantics.yml
          git rm scripts/activate_animation_semantics.py
          git commit -m "feat(python): activate complete Animation semantics" -m "Execute the pinned semantic continuation after bootstrap construction, run its dedicated acceptance suite inside the production PyO3 harness, and retire the activation machinery only after fmn-python and conformance tests pass."
          git pull --rebase origin main
          git push origin HEAD:main
