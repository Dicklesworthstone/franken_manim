name: FM AI1 Pin Align

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fm-ai1-pin-align.yml"
      - "SUITE.lock"
      - "Cargo.toml"
  workflow_dispatch:
  schedule:
    - cron: "2,22,42 * * * *"

permissions:
  contents: write

concurrency:
  group: fm-ai1-pin-align
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

jobs:
  align:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install governed toolchain
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-05 --profile minimal --component rustfmt
          rustup override set nightly-2026-07-05

      - name: Align all consumed FrankenNumPy packages to current SUITE.lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          suite = Path("SUITE.lock").read_text(encoding="utf-8")
          rows = [line for line in suite.splitlines() if line.startswith("franken_numpy\t")]
          if len(rows) != 1:
              raise SystemExit(f"expected one franken_numpy SUITE.lock row, found {len(rows)}")
          pin = rows[0].split("\t", 2)[1]
          if re.fullmatch(r"[0-9a-f]{40}", pin) is None:
              raise SystemExit(f"invalid FrankenNumPy pin {pin!r}")

          cargo_path = Path("Cargo.toml")
          cargo = cargo_path.read_text(encoding="utf-8")
          for package in ("fnp-dtype", "fnp-ndarray", "fnp-io", "fnp-random-core"):
              pattern = rf'(^' + re.escape(package) + rf' = \{{ git = "https://github.com/Dicklesworthstone/franken_numpy", rev = ")[0-9a-f]{{40}}(".*$)'
              cargo, count = re.subn(pattern, rf'\g<1>{pin}\2', cargo, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Cargo.toml lacks exactly one governed {package} dependency")
          cargo_path.write_text(cargo, encoding="utf-8")

          manifest = Path("crates/fmn-core/Cargo.toml").read_text(encoding="utf-8")
          if "fnp-random-core.workspace = true" not in manifest:
              raise SystemExit("fmn-core is not wired to fnp-random-core")

          allow_path = Path("SUITE_ALLOWLIST.tsv")
          allow = allow_path.read_text(encoding="utf-8")
          row = (
              "fnp-random-core\t0.2.0\tgit+franken_numpy@SUITE.lock\t-\t-\t"
              "MIT+rider\tno\tno\tno\tno\tforbid\truntime\t"
              "fm-ai1: dependency-free SeedSequence and PCG64DXSM authority; no OS entropy, ndarray, rayon, or distribution surface; rev must equal the SUITE.lock franken_numpy pin\t"
              "fm\tsuite-lock-ritual\n"
          )
          allow = "".join(line for line in allow.splitlines(keepends=True) if not line.startswith("fnp-random-core\t"))
          anchor = next(
              (line for line in allow.splitlines(keepends=True) if line.startswith("fnp-ndarray\t0.2.0\tgit+franken_numpy@SUITE.lock\t")),
              None,
          )
          if anchor is None:
              raise SystemExit("SUITE_ALLOWLIST.tsv lacks the fnp-ndarray anchor")
          allow_path.write_text(allow.replace(anchor, anchor + row, 1), encoding="utf-8")
          PY
          cargo check -p fmn-core --all-targets
          cargo fmt --all -- --check
          git diff --check

      - name: Publish alignment and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/fm-ai1-pin-align.yml
          git add Cargo.toml Cargo.lock SUITE_ALLOWLIST.tsv
          git diff --cached --check
          git config user.name "FrankenManim FM-AI1 Pin Aligner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(fnp): align the governed FrankenNumPy source identity" \
            -m "Move dtype, ndarray, npy I/O, and dependency-free random-core together to the current SUITE.lock revision; regenerate the lock and allowlist without changing the suite authority."
          final_sha="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$parent" ]] || {
            echo "main moved during the short alignment window; scheduled retry will derive the new live suite pin" >&2
            exit 12
          }
          git push origin "$final_sha:refs/heads/main"
          git push origin "$final_sha:refs/heads/master"
