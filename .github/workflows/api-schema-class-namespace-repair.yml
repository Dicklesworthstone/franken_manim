          git commit -m "ci(schema): retain read-only schema verifier" -m "Replace the completed write-enabled repair bootstrap with an explicit manual verification lane for class-namespace extraction, helper alias policy, and schema-derived artifact drift."
          git pull --rebase origin main
          git push origin HEAD:main
