name: Extend RNG Replay API

on:
  workflow_run:
    workflows: ["Complete fm-ai1 RNG Cutover"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extend-rng-replay-api
  cancel-in-progress: false

jobs:
  extend:
    if: >-
      github.repository == 'Dicklesworthstone/franken_manim' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install governed toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-05 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup override set nightly-2026-07-05
          python3 -m pip install --user --break-system-packages numpy || python3 -m pip install --user numpy

      - name: Add replay seeking and allocation-free bulk fills
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/complete-fm-ai1.yml
          grep -Fq '"id":"fm-ai1"' .beads/issues.jsonl
          grep -F '"id":"fm-ai1"' .beads/issues.jsonl | grep -Fq '"status":"closed"'
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/fmn-core/src/rng.rs")
          source = path.read_text(encoding="utf-8")
          marker = "    /// Advance the stream by `draws` raw outputs in logarithmic time.\n"
          if marker not in source:
              anchor = (
                  "    pub fn next_f64(&mut self) -> f64 {\n"
                  "        self.inner.next_f64()\n"
                  "    }\n\n"
              )
              if source.count(anchor) != 1:
                  raise SystemExit("Pcg64Dxsm next_f64 anchor drifted")
              addition = (
                  anchor
                  + "    /// Advance the stream by `draws` raw outputs in logarithmic time.\n"
                  + "    ///\n"
                  + "    /// This is the replay/checkpoint primitive: skipping a large recorded\n"
                  + "    /// interval does not require generating and discarding every value.\n"
                  + "    pub fn advance(&mut self, draws: u128) {\n"
                  + "        self.inner.advance(draws);\n"
                  + "    }\n\n"
                  + "    /// Fill caller-owned storage with raw outputs without allocating.\n"
                  + "    pub fn fill_u64(&mut self, output: &mut [u64]) {\n"
                  + "        for slot in output {\n"
                  + "            *slot = self.next_u64();\n"
                  + "        }\n"
                  + "    }\n\n"
                  + "    /// Fill caller-owned storage with NumPy-compatible `[0, 1)` doubles.\n"
                  + "    pub fn fill_f64(&mut self, output: &mut [f64]) {\n"
                  + "        for slot in output {\n"
                  + "            *slot = self.next_f64();\n"
                  + "        }\n"
                  + "    }\n\n"
              )
              source = source.replace(anchor, addition, 1)

          test_marker = "    fn logarithmic_advance_matches_scalar_replay()"
          if test_marker not in source:
              insertion = source.rfind("}\n")
              if insertion < 0:
                  raise SystemExit("rng test module terminator not found")
              tests = '''    #[test]
    fn logarithmic_advance_matches_scalar_replay() {
        for draws in [0_u128, 1, 2, 17, 257, 65_537] {
            let mut scalar = Pcg64Dxsm::from_seed(0x0ddc_0ffe_e15e_beef);
            for _ in 0..draws {
                let _ = scalar.next_u64();
            }
            let mut sought = Pcg64Dxsm::from_seed(0x0ddc_0ffe_e15e_beef);
            sought.advance(draws);
            assert_eq!(sought.state(), scalar.state());
            assert_eq!(sought.next_u64(), scalar.next_u64());
        }
    }

    #[test]
    fn bulk_u64_fill_is_exactly_the_scalar_stream() {
        let mut bulk = Pcg64Dxsm::from_seed(41);
        let mut actual = [0_u64; 1_025];
        bulk.fill_u64(&mut actual);

        let mut scalar = Pcg64Dxsm::from_seed(41);
        let expected: Vec<u64> = (0..actual.len()).map(|_| scalar.next_u64()).collect();
        assert_eq!(actual.as_slice(), expected.as_slice());
        assert_eq!(bulk.state(), scalar.state());
    }

    #[test]
    fn bulk_f64_fill_is_exactly_the_scalar_stream() {
        let mut bulk = Pcg64Dxsm::from_seed(42);
        let mut actual = [0.0_f64; 513];
        bulk.fill_f64(&mut actual);

        let mut scalar = Pcg64Dxsm::from_seed(42);
        let expected: Vec<u64> = (0..actual.len())
            .map(|_| scalar.next_f64().to_bits())
            .collect();
        assert_eq!(
            actual.iter().map(|value| value.to_bits()).collect::<Vec<_>>(),
            expected
        );
        assert_eq!(bulk.state(), scalar.state());
    }

    #[test]
    fn seek_then_snapshot_restore_preserves_the_future() {
        let mut original = Pcg64Dxsm::from_seed(99);
        original.advance(1_u128 << 80);
        let (state, increment) = original.state();
        let mut restored = Pcg64Dxsm::restore(state, increment);
        let mut left = [0_u64; 128];
        let mut right = [0_u64; 128];
        original.fill_u64(&mut left);
        restored.fill_u64(&mut right);
        assert_eq!(left, right);
        assert_eq!(original.state(), restored.state());
    }

'''
              source = source[:insertion] + tests + source[insertion:]
          path.write_text(source, encoding="utf-8")
          PY
          cargo fmt --all

      - name: Verify production behavior and complete Gauntlet
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p fmn-core --all-targets
          cargo test -p fmn-core
          cargo test -p fmn-core --test rng_parity
          cargo check --target wasm32-unknown-unknown -p fmn-core
          cargo clippy -p fmn-core --all-targets -- -D warnings
          bash scripts/check.sh
          git diff --check

      - name: Record the implemented capability truthfully
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "### Deterministic RNG replay primitives (2026-09-03)"
          if marker not in changelog:
              entry = (
                  "\n" + marker + "\n\n"
                  "- Added logarithmic `Pcg64Dxsm::advance` for replay/checkpoint seeking without generating discarded values.\n"
                  "- Added allocation-free `fill_u64` and `fill_f64` APIs over caller-owned buffers.\n"
                  "- Locked both operations to scalar stream identity, exact post-operation state, snapshot/restore continuity, NumPy vectors, native compilation, and wasm32 compilation.\n"
              )
              first_break = changelog.find("\n", changelog.find("#"))
              changelog = changelog[: first_break + 1] + entry + changelog[first_break + 1 :]
              changelog_path.write_text(changelog, encoding="utf-8")

          status_candidates = [
              Path("IMPLEMENTATION_STATUS.md"),
              Path("docs/IMPLEMENTATION_STATUS.md"),
              Path("docs/implementation_status.md"),
          ]
          status_path = next((path for path in status_candidates if path.exists()), status_candidates[-1])
          status = status_path.read_text(encoding="utf-8") if status_path.exists() else "# Implementation Status\n"
          marker = "## 2026-09-03: deterministic RNG replay operations"
          if marker not in status:
              status += (
                  "\n" + marker + "\n\n"
                  "**Implemented and gated:** logarithmic random-stream seeking plus allocation-free raw-word and floating bulk fills. The tests prove equality with scalar generation, equality of resulting internal state, compatibility with split-state journals after very large skips, and unchanged NumPy fixture parity.\n"
              )
              status_path.parent.mkdir(parents=True, exist_ok=True)
              status_path.write_text(status, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          sentence = "Replay consumers can seek a PCG64DXSM stream in logarithmic time and fill caller-owned `u64` or `f64` buffers without allocation; both operations are state-identical to scalar draws."
          if sentence not in readme:
              anchor = "### Deterministic RNG authority"
              location = readme.find(anchor)
              if location < 0:
                  raise SystemExit("README RNG authority section is absent")
              paragraph_end = readme.find("\n\n", location)
              paragraph_end = readme.find("\n\n", paragraph_end + 2)
              if paragraph_end < 0:
                  paragraph_end = len(readme)
              readme = readme[:paragraph_end] + "\n\n" + sentence + readme[paragraph_end:]
              readme_path.write_text(readme, encoding="utf-8")
          PY
          git diff --check

      - name: Commit tested replay functionality directly to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/extend-rng-replay-api.yml
          git add -A
          git config user.name "FrankenManim Replay API"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(core): add deterministic RNG seek and bulk fills" -m "Expose logarithmic PCG64DXSM replay seeking and allocation-free caller-buffer fills through fmn-core. Prove exact scalar-stream and state equivalence, huge-offset snapshot continuity, NumPy fixture stability, native/wasm compilation, and the full mandatory Gauntlet."
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
            cargo test -p fmn-core --test rng_parity
            bash scripts/check.sh
          fi
          git push origin HEAD:main
