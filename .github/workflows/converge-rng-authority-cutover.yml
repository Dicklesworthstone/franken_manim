name: Converge RNG Authority Cutover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/converge-rng-authority-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: converge-rng-authority-cutover
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  converge:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install governed toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-05 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup override set nightly-2026-07-05
          if ! command -v wasm-pack >/dev/null 2>&1 || [[ "$(wasm-pack --version)" != "wasm-pack 0.15.0" ]]; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi

      - name: Install deterministic finalizer and capture critical identities
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/finalize_rng_cutover.py <<'PY'
          import hashlib
          import json
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          WORKFLOWS = (
              ".github/workflows/converge-rng-authority-cutover.yml",
              ".github/workflows/complete-rng-authority-cutover.yml",
              ".github/workflows/finalize-rng-migration.yml",
          )

          def suite_pin() -> str:
              suite = Path("SUITE.lock").read_text(encoding="utf-8")
              row = next((line for line in suite.splitlines() if line.startswith("franken_numpy\t")), None)
              if row is None:
                  raise SystemExit("SUITE.lock lacks the franken_numpy row")
              pin = row.split("\t", 2)[1]
              if len(pin) != 40 or any(character not in "0123456789abcdef" for character in pin):
                  raise SystemExit(f"invalid franken_numpy pin {pin!r}")
              return pin

          def assert_source_identity() -> str:
              pin = suite_pin()
              cargo = Path("Cargo.toml").read_text(encoding="utf-8")
              for package in ("fnp-dtype", "fnp-ndarray", "fnp-io", "fnp-random-core"):
                  pattern = rf'^{re.escape(package)} = \{{ git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "([0-9a-f]{{40}})"'
                  match = re.search(pattern, cargo, re.MULTILINE)
                  if match is None:
                      raise SystemExit(f"workspace dependency {package} lacks a governed FrankenNumPy pin")
                  if match.group(1) != pin:
                      raise SystemExit(f"{package} pins {match.group(1)} but SUITE.lock pins {pin}")
              rng = Path("crates/fmn-core/src/rng.rs").read_text(encoding="utf-8")
              for required in ("pub use fnp_random_core::SeedSequence", "fnp_random_core::Pcg64Dxsm"):
                  if required not in rng:
                      raise SystemExit(f"fmn-core RNG wrapper lacks upstream delegation marker {required!r}")
              return pin

          def admit_random_core() -> None:
              path = Path("SUITE_ALLOWLIST.tsv")
              text = path.read_text(encoding="utf-8")
              row = (
                  "fnp-random-core\t0.2.0\tgit+franken_numpy@SUITE.lock\t-\t-\t"
                  "MIT+rider\tno\tno\tno\tno\tforbid\truntime\t"
                  "fm-ai1: dependency-free SeedSequence and PCG64DXSM authority; no OS entropy, ndarray, rayon, or distribution surface; rev must equal the SUITE.lock franken_numpy pin\t"
                  "fm\tsuite-lock-ritual\n"
              )
              retained = [line for line in text.splitlines(keepends=True) if not line.startswith("fnp-random-core\t")]
              text = "".join(retained)
              anchor = next(
                  (line for line in text.splitlines(keepends=True) if line.startswith("fnp-ndarray\t0.2.0\tgit+franken_numpy@SUITE.lock\t")),
                  None,
              )
              if anchor is None:
                  raise SystemExit("SUITE_ALLOWLIST.tsv lacks the fnp-ndarray anchor")
              path.write_text(text.replace(anchor, anchor + row, 1), encoding="utf-8")

          def upsert(path: Path, start: str, end: str, body: str, *, append: bool = False) -> None:
              text = path.read_text(encoding="utf-8") if path.exists() else ""
              block = f"{start}\n{body.rstrip()}\n{end}"
              if start in text:
                  before, remainder = text.split(start, 1)
                  if end not in remainder:
                      raise SystemExit(f"{path} has an unterminated generated block")
                  _, after = remainder.split(end, 1)
                  text = before.rstrip() + "\n\n" + block + after
              elif append or not text.startswith("#"):
                  text = text.rstrip() + "\n\n" + block + "\n"
              else:
                  newline = text.find("\n")
                  text = text[: newline + 1] + "\n" + block + "\n" + text[newline + 1 :].lstrip("\n")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text.rstrip() + "\n", encoding="utf-8")

          def refresh_wasm_audit() -> None:
              path = Path("docs/wasm_audit.md")
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              status = (
                  "**Status:** re-derived after fm-ai1 moved NumPy-compatible SeedSequence and "
                  "PCG64DXSM into FrankenNumPy's dependency-free `fnp-random-core` and made "
                  "`fmn-core` consume that authority. The real wasm32 package build, fresh npm "
                  "consumer/browser exercise, and Node smoke path passed before this audit was "
                  "refreshed; no host entropy, ndarray, Rayon, or full distribution engine entered "
                  "the browser graph."
              )
              for index, line in enumerate(lines):
                  if line.startswith("**Status:**"):
                      lines[index] = status
                      break
              else:
                  raise SystemExit("docs/wasm_audit.md lacks a Status line")
              text = "\n".join(lines) + "\n"
              for authority in ("SUITE.lock", "Cargo.lock"):
                  digest = hashlib.sha256(Path(authority).read_bytes()).hexdigest()
                  pattern = rf'- `{re.escape(authority)}` SHA-256: `[0-9a-f]{{64}}`'
                  text, count = re.subn(pattern, f'- `{authority}` SHA-256: `{digest}`', text, count=1)
                  if count != 1:
                      raise SystemExit(f"could not refresh {authority} digest")
              census_without = "`fmn-wasm`, `fmn-anim`, `fmn-cache`, `fmn-codec`, `fmn-config`, `fmn-core`, `fmn-dmath`, `fmn-frame`, `fmn-geom`, `fmn-hash`, `fmn-mobject`, `fmn-platform`, `fmn-render`, `fmn-scene`"
              census_with = census_without + ", `fnp-random-core`"
              if census_with not in text:
                  if census_without not in text:
                      raise SystemExit("could not locate shipped wasm package census")
                  text = text.replace(census_without, census_with, 1)
              paragraph = (
                  "`fnp-random-core` enters the shipped serial and shared-memory graphs only through "
                  "`fmn-core`. Its package manifest has no dependencies, its crate forbids unsafe "
                  "code, and it exposes deterministic state transforms only. The wasm32 build and "
                  "browser execution therefore exercise the same upstream PCG64DXSM state machine "
                  "as the native engine without admitting `fnp-random`, host entropy, array storage, "
                  "or a thread pool.\n\n"
              )
              if paragraph not in text:
                  anchor = "fmn-geom now enters with its doctrine-D4 solver gateway:"
                  if anchor not in text:
                      raise SystemExit("could not locate wasm explanation anchor")
                  text = text.replace(anchor, paragraph + anchor, 1)
              old = "| `franken_numpy`, `frankenscipy`, `franken_networkx`, `frankenpandas` | not consumed by the current wasm graph; any future subset requires its own target build and governed-closure update |"
              new = "| the remainder of `franken_numpy` (`fnp-random`, arrays, linalg, I/O, and Python surfaces), plus `frankenscipy`, `franken_networkx`, and `frankenpandas` | not consumed by the current wasm graph; only dependency-free `fnp-random-core` is admitted through `fmn-core`, and any future subset requires its own target build and governed-closure update |"
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit("could not locate intentionally-absent suite row")
              path.write_text(text, encoding="utf-8")

          def publish_docs_and_bead() -> Path:
              changelog = """## FrankenNumPy RNG authority cutover

### Changed
- `fmn-core` delegates NumPy-compatible SeedSequence/PCG64DXSM state transitions to dependency-free `fnp-random-core` while retaining named substreams, frame-keyed forks, and split-state journals.
- Every consumed `fnp-*` package resolves through one exact `SUITE.lock` source identity.

### Evidence
- The complete committed NumPy fixture covers SeedSequence words, raw draws, doubles, named streams, and frame indices above `u32::MAX`.
- Closure regressions prove the full `fnp-random`, ndarray, Rayon, and host-entropy surfaces do not enter `fmn-core`.
- Native, wasm32, packaged browser, Node smoke, and mandatory project gates were exercised before publication."""
              upsert(Path("CHANGELOG.md"), "<!-- fm-ai1-changelog:start -->", "<!-- fm-ai1-changelog:end -->", changelog)
              readme = """## Deterministic RNG authority

FrankenManim's scene-level contract is one explicit root seed, length-delimited UTF-8 named substreams, and pure `(substream, frame_index)` forks. NumPy-compatible SeedSequence mixing and PCG64DXSM state transitions are owned by the pinned, dependency-free `fnp-random-core` crate in FrankenNumPy. `fmn-core` wraps that primitive only to preserve split-state journals and the scene stream layout. Native and browser builds therefore share one implementation without importing the full distribution engine, OS entropy, ndarray storage, or Rayon.

The committed NumPy fixture covers SeedSequence output, raw words, doubles, named streams, and 64-bit frame indices. Permanent closure tests bind every consumed `fnp-*` package to the same `SUITE.lock` commit."""
              upsert(Path("README.md"), "<!-- fm-ai1-readme:start -->", "<!-- fm-ai1-readme:end -->", readme, append=True)
              candidates = [Path("IMPLEMENTATION_STATUS.md"), Path("docs/IMPLEMENTATION_STATUS.md"), Path("docs/implementation_status.md"), Path("docs/status.md")]
              status_path = next((candidate for candidate in candidates if candidate.exists()), candidates[1])
              status = """## fm-ai1: upstream deterministic RNG authority — complete

**Production behavior:** `fmn-core` delegates SeedSequence and PCG64DXSM to dependency-free `fnp-random-core`. Named substreams, pure frame-keyed forks, split-state restore, and `RNG_LAYOUT_VERSION = 1` remain stable.

**Earned evidence:** complete committed NumPy vectors; state round trips; native tests and warning-denied Clippy; wasm32 compilation; exact governed-source and zero-dependency regressions; packaged browser execution; Node smoke; mandatory project gate.

**Deliberate boundary:** unseeded entropy remains a platform capability supplied before `fmn-core`; the full `fnp-random` distribution engine is not part of the native or browser closure."""
              upsert(status_path, "<!-- fm-ai1-status:start -->", "<!-- fm-ai1-status:end -->", status, append=True)
              issues = Path(".beads/issues.jsonl")
              now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
              reason = (
                  "Completed upstream RNG authority cutover: dependency-free fnp-random-core owns "
                  "SeedSequence/PCG64DXSM; fmn-core preserves named substreams, frame forks, and "
                  "journals; complete NumPy vectors, native/wasm builds, governed closure, browser "
                  "package, Node smoke, and the mandatory gate passed before publication."
              )
              output = []
              found = False
              for line in issues.read_text(encoding="utf-8").splitlines():
                  if not line:
                      continue
                  issue = json.loads(line)
                  if issue.get("id") == "fm-ai1":
                      found = True
                      issue["status"] = "closed"
                      issue["updated_at"] = now
                      issue["closed_at"] = issue.get("closed_at") or now
                      issue["close_reason"] = reason
                  output.append(json.dumps(issue, separators=(",", ":"), ensure_ascii=False))
              if not found:
                  raise SystemExit("fm-ai1 missing from issues.jsonl")
              issues.write_text("\n".join(output) + "\n", encoding="utf-8")
              return status_path

          mode = sys.argv[1]
          if mode == "prepare":
              print(assert_source_identity())
              admit_random_core()
          elif mode == "finalize":
              assert_source_identity()
              admit_random_core()
              refresh_wasm_audit()
              print(publish_docs_and_bead())
          else:
              raise SystemExit(f"unknown mode {mode}")
          PY
          chmod 755 /tmp/finalize_rng_cutover.py
          critical=(Cargo.toml Cargo.lock SUITE.lock SUITE_ALLOWLIST.tsv crates/fmn-core/Cargo.toml crates/fmn-core/src/rng.rs crates/fmn-core/tests/rng_parity.rs crates/fmn-conformance/tests/franken_numpy_pin.rs)
          : > /tmp/critical.sha256
          for path in "${critical[@]}"; do sha256sum "$path" >> /tmp/critical.sha256; done
          python3 /tmp/finalize_rng_cutover.py prepare > /tmp/fnp-pin
          cargo check -p fmn-core --all-targets

      - name: Earn complete native and browser evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p fmn-core
          cargo check --target wasm32-unknown-unknown -p fmn-core
          cargo test -p fmn-conformance --test governed_closure workspace_closure_is_exactly_the_governed_universe -- --exact
          cargo test -p fmn-conformance --test governed_closure git_dependencies_ride_their_suite_lock_pins -- --exact
          cargo test -p fmn-conformance --test governed_closure suite_lock_parses_and_matches_the_pinned_toolchain -- --exact
          cargo test -p fmn-conformance --test franken_numpy_pin
          cargo clippy -p fmn-core --all-targets -- -D warnings
          cargo clippy -p fmn-conformance --test franken_numpy_pin -- -D warnings
          bash scripts/check_wasm_package.sh
          bash wasm-smoke/run.sh
          # Refresh authority-bound audit hashes before invoking the full gate.
          status_path="$(python3 /tmp/finalize_rng_cutover.py finalize)"
          echo "$status_path" > /tmp/status-path
          timeout 7200 bash scripts/check.sh

      - name: Converge generated state across unrelated main movement
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            tested_head="$(git rev-parse HEAD)"
            git fetch origin main '+refs/heads/*:refs/remotes/origin/*' --prune
            latest="$(git rev-parse origin/main)"
            if [[ "$latest" != "$tested_head" ]]; then
              # The cutover-critical authorities must be byte-identical to the fully
              # tested versions. Unrelated main work may advance; relevant drift fails closed.
              while read -r expected path; do
                actual="$(git show "origin/main:$path" | sha256sum | awk '{print $1}')"
                if [[ "$actual" != "$expected" ]]; then
                  echo "cutover-critical file changed while evidence ran: $path" >&2
                  exit 20
                fi
              done < /tmp/critical.sha256
              git reset --hard origin/main
              status_path="$(python3 /tmp/finalize_rng_cutover.py finalize)"
              echo "$status_path" > /tmp/status-path
              cargo check -p fmn-core --all-targets
              cargo test -p fmn-core
              cargo check --target wasm32-unknown-unknown -p fmn-core
              cargo test -p fmn-conformance --test franken_numpy_pin
              cargo test -p fmn-conformance --test governed_closure workspace_closure_is_exactly_the_governed_universe -- --exact
            fi

            status_path="$(cat /tmp/status-path)"
            for workflow in \
              .github/workflows/converge-rng-authority-cutover.yml \
              .github/workflows/complete-rng-authority-cutover.yml \
              .github/workflows/finalize-rng-migration.yml; do
              [[ -e "$workflow" ]] && git rm -f "$workflow"
            done
            git add Cargo.lock SUITE_ALLOWLIST.tsv docs/wasm_audit.md README.md CHANGELOG.md \
              .beads/issues.jsonl "$status_path" crates/fmn-core/src/rng.rs \
              crates/fmn-conformance/tests/franken_numpy_pin.rs
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "cutover state already converged"
              exit 0
            fi
            git config user.name "FrankenManim RNG Cutover"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(core): complete upstream RNG authority cutover" \
              -m "Publish the governed lock and allowlist, refreshed real WASM evidence, complete-vector/source-identity regressions, truthful project status, and earned fm-ai1 closure."
            candidate="$(git rev-parse HEAD)"
            parent="$(git rev-parse HEAD^)"
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" == "$parent" ]]; then
              git push origin "$candidate:refs/heads/main"
              echo "FINAL_SHA=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "main moved during short publication window; retrying ($attempt/6)"
            git reset --hard HEAD^
          done
          echo "could not obtain a short lease-safe publication window" >&2
          exit 21

      - name: Reconcile canonical refs without deleting divergent work
        shell: bash
        run: |
          set -euo pipefail
          final_sha="${FINAL_SHA:-$(git rev-parse origin/main)}"
          git push origin "$final_sha:refs/heads/master"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          while IFS= read -r branch; do
            case "$branch" in HEAD|main|master) continue;; esac
            ref="refs/remotes/origin/$branch"
            if ! git merge-base --is-ancestor "$ref" "$final_sha"; then
              echo "refusing to delete divergent branch $branch" >&2
              git log --oneline "$final_sha".."$ref" >&2
              exit 30
            fi
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)
          mapfile -t heads < <(git ls-remote --heads origin | awk '{name=$2; sub("^refs/heads/", "", name); print name}' | sort)
          if [[ "${heads[*]}" != "main master" ]]; then
            printf 'unexpected branch set:\n  %s\n' "${heads[@]}" >&2
            exit 31
          fi
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          master_sha="$(git ls-remote --heads origin refs/heads/master | awk '{print $1}')"
          if [[ "$main_sha" != "$master_sha" || "$main_sha" != "$final_sha" ]]; then
            echo "main/master convergence failed: expected=$final_sha main=$main_sha master=$master_sha" >&2
            exit 32
          fi
