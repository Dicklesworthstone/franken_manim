name: FM AI1 Finalizer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fm-ai1-finalizer.yml"
  workflow_dispatch:
  schedule:
    - cron: "9,29,49 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: fm-ai1-finalizer
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  finalize:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Cancel superseded RNG integration runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          obsolete='^(FM AI1 Authority Verifier|FM AI1 Authority Verifier V2|FM AI1 Live Attestor|Complete RNG Authority Cutover|Converge RNG Authority Cutover|Finalize RNG Migration)$'
          gh run list --limit 100 --json databaseId,workflowName,status --jq \
            ".[] | select((.workflowName | test(\"$obsolete\")) and (.status == \"queued\" or .status == \"in_progress\")) | .databaseId" |
          while read -r run_id; do
            [[ -z "$run_id" ]] && continue
            gh run cancel "$run_id" || true
          done

      - name: Install governed toolchain and integration prerequisites
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-05 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup override set nightly-2026-07-05
          sudo apt-get update
          sudo apt-get install -y ripgrep
          python3 -m pip install --user --break-system-packages numpy || python3 -m pip install --user numpy
          if ! command -v wasm-pack >/dev/null 2>&1 || [[ "$(wasm-pack --version)" != "wasm-pack 0.15.0" ]]; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi

      - name: Install deterministic normalization helper
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fm_ai1_normalize.py <<'PY'
          import re
          from pathlib import Path

          suite = Path("SUITE.lock").read_text(encoding="utf-8")
          rows = [line for line in suite.splitlines() if line.startswith("franken_numpy\t")]
          if len(rows) != 1:
              raise SystemExit(f"expected one franken_numpy SUITE.lock row, found {len(rows)}")
          pin = rows[0].split("\t", 2)[1]
          if re.fullmatch(r"[0-9a-f]{40}", pin) is None:
              raise SystemExit(f"invalid FrankenNumPy pin {pin!r}")
          cargo = Path("Cargo.toml").read_text(encoding="utf-8")
          for package in ("fnp-dtype", "fnp-ndarray", "fnp-io", "fnp-random-core"):
              match = re.search(
                  rf'^{re.escape(package)} = \{{ git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "([0-9a-f]{{40}})"',
                  cargo,
                  re.MULTILINE,
              )
              if match is None:
                  raise SystemExit(f"workspace dependency {package} lacks a governed git pin")
              if match.group(1) != pin:
                  raise SystemExit(f"{package} pins {match.group(1)} while SUITE.lock pins {pin}")

          core_manifest = Path("crates/fmn-core/Cargo.toml").read_text(encoding="utf-8")
          if "fnp-random-core.workspace = true" not in core_manifest:
              raise SystemExit("fmn-core is not wired to fnp-random-core")
          rng = Path("crates/fmn-core/src/rng.rs").read_text(encoding="utf-8")
          for marker in ("pub use fnp_random_core::SeedSequence", "fnp_random_core::Pcg64Dxsm"):
              if marker not in rng:
                  raise SystemExit(f"fmn-core RNG wrapper lacks {marker!r}")

          allow_path = Path("SUITE_ALLOWLIST.tsv")
          allow = allow_path.read_text(encoding="utf-8")
          row = (
              "fnp-random-core\t0.2.0\tgit+franken_numpy@SUITE.lock\t-\t-\t"
              "MIT+rider\tno\tno\tno\tno\tforbid\truntime\t"
              "fm-ai1: dependency-free SeedSequence and PCG64DXSM authority; no OS entropy, ndarray, rayon, or distribution surface; rev must equal the SUITE.lock franken_numpy pin\t"
              "fm\tsuite-lock-ritual\n"
          )
          allow = "".join(line for line in allow.splitlines(keepends=True) if not line.startswith("fnp-random-core\t"))
          anchor = next(
              (line for line in allow.splitlines(keepends=True) if line.startswith("fnp-ndarray\t0.2.0\tgit+franken_numpy@SUITE.lock\t")),
              None,
          )
          if anchor is None:
              raise SystemExit("SUITE_ALLOWLIST.tsv lacks the fnp-ndarray anchor")
          allow_path.write_text(allow.replace(anchor, anchor + row, 1), encoding="utf-8")
          Path("/tmp/fm-ai1-pin").write_text(pin + "\n", encoding="utf-8")
          PY
          chmod 755 /tmp/fm_ai1_normalize.py

      - name: Land generated closure state and retire obsolete workflows
        shell: bash
        run: |
          set -euo pipefail
          obsolete=(
            .github/workflows/fm-ai1-authority-verifier-v2.yml
            .github/workflows/fm-ai1-authority-verifier.yml
            .github/workflows/fm-ai1-live-attestor.yml
            .github/workflows/converge-rng-authority-cutover.yml
            .github/workflows/complete-rng-authority-cutover.yml
            .github/workflows/finalize-rng-migration.yml
          )
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python3 /tmp/fm_ai1_normalize.py
            for path in "${obsolete[@]}"; do
              [[ -e "$path" ]] && rm -f "$path"
            done
            cargo check -p fmn-core --all-targets
            cargo fmt --all -- --check
            git add Cargo.lock SUITE_ALLOWLIST.tsv .github/workflows
            git diff --cached --check
            if git diff --cached --quiet; then
              base_sha="$(git rev-parse HEAD)"
              echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
              break
            fi
            git config user.name "FrankenManim FM-AI1 Finalizer"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(core): lock the upstream RNG authority" \
              -m "Record dependency-free fnp-random-core in the governed closure and retire superseded one-shot verifier machinery before the full evidence run."
            candidate="$(git rev-parse HEAD)"
            parent="$(git rev-parse HEAD^)"
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" == "$parent" ]]; then
              git push origin "$candidate:refs/heads/main"
              git push origin "$candidate:refs/heads/master"
              echo "BASE_SHA=$candidate" >> "$GITHUB_ENV"
              break
            fi
            [[ "$attempt" -lt 8 ]] || exit 20
          done
          test -n "${BASE_SHA:-}"
          git checkout --detach "$BASE_SHA"

      - name: Determine whether full evidence is already published
        id: completion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = Path("artifacts/fm-ai1-completion.json")
          complete = False
          if receipt.exists():
              payload = json.loads(receipt.read_text(encoding="utf-8"))
              complete = payload.get("verdict") == "pass" and str(payload.get("schema", "")).startswith("franken-manim.fm-ai1-completion.v")
          if complete:
              issues = [json.loads(line) for line in Path(".beads/issues.jsonl").read_text(encoding="utf-8").splitlines() if line]
              bead = next((issue for issue in issues if issue.get("id") == "fm-ai1"), None)
              complete = bead is not None and bead.get("status") == "closed"
          Path("/tmp/fm-ai1-complete").write_text("yes\n" if complete else "no\n", encoding="utf-8")
          PY
          echo "state=$(cat /tmp/fm-ai1-complete)" >> "$GITHUB_OUTPUT"

      - name: Run complete acceptance evidence
        if: steps.completion.outputs.state == 'no'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-core
          cargo check --locked --target wasm32-unknown-unknown -p fmn-core
          cargo test --locked -p fmn-conformance --test governed_closure workspace_closure_is_exactly_the_governed_universe -- --exact
          cargo test --locked -p fmn-conformance --test governed_closure git_dependencies_ride_their_suite_lock_pins -- --exact
          cargo test --locked -p fmn-conformance --test governed_closure suite_lock_parses_and_matches_the_pinned_toolchain -- --exact
          cargo test --locked -p fmn-conformance --test franken_numpy_pin
          cargo clippy --locked -p fmn-core --all-targets -- -D warnings
          cargo clippy --locked -p fmn-conformance --test franken_numpy_pin -- -D warnings
          timeout 3600 bash scripts/check_wasm_package.sh
          timeout 1800 bash wasm-smoke/run.sh
          timeout 7200 bash scripts/check.sh

      - name: Re-run focused evidence for an already-complete transaction
        if: steps.completion.outputs.state == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fmn-core
          cargo check --locked --target wasm32-unknown-unknown -p fmn-core
          cargo test --locked -p fmn-conformance --test franken_numpy_pin
          cargo test --locked -p fmn-conformance --test governed_closure workspace_closure_is_exactly_the_governed_universe -- --exact

      - name: Verify current main still contains the exact tested authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main '+refs/heads/*:refs/remotes/origin/*' --prune
          latest="$(git rev-parse origin/main)"
          critical=(
            Cargo.toml Cargo.lock SUITE.lock SUITE_ALLOWLIST.tsv
            crates/fmn-core/Cargo.toml crates/fmn-core/src/rng.rs crates/fmn-core/tests/rng_parity.rs
            crates/fmn-conformance/tests/franken_numpy_pin.rs
          )
          for path in "${critical[@]}"; do
            git diff --quiet "$BASE_SHA" "$latest" -- "$path" || {
              echo "cutover-critical path changed after evidence started: $path" >&2
              exit 21
            }
          done
          git checkout -B fm-ai1-publish "$latest"

      - name: Generate completion receipt, docs, bead closure, and visual seal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import binascii
          import hashlib
          import json
          import re
          import struct
          import subprocess
          import zlib
          from datetime import datetime, timezone
          from pathlib import Path

          def upsert(path: Path, start: str, end: str, body: str, *, append: bool = False) -> None:
              text = path.read_text(encoding="utf-8") if path.exists() else ""
              block = f"{start}\n{body.rstrip()}\n{end}"
              if start in text:
                  before, remainder = text.split(start, 1)
                  if end not in remainder:
                      raise SystemExit(f"unterminated generated block in {path}")
                  _, after = remainder.split(end, 1)
                  text = before.rstrip() + "\n\n" + block + after
              elif append or not text.startswith("#"):
                  text = text.rstrip() + "\n\n" + block + "\n"
              else:
                  newline = text.find("\n")
                  text = text[: newline + 1] + "\n" + block + "\n" + text[newline + 1 :].lstrip("\n")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text.rstrip() + "\n", encoding="utf-8")

          pin = Path("/tmp/fm-ai1-pin").read_text(encoding="utf-8").strip()
          tested = __import__("os").environ["BASE_SHA"]
          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          audit_path = Path("docs/wasm_audit.md")
          audit = audit_path.read_text(encoding="utf-8")
          lines = audit.splitlines()
          status = (
              "**Status:** re-derived after fm-ai1 moved NumPy-compatible SeedSequence and PCG64DXSM "
              "into FrankenNumPy's dependency-free `fnp-random-core` and made `fmn-core` consume that "
              "authority. The real wasm32 package build, npm consumer/browser exercise, and Node smoke "
              "path passed on the exact tested live ancestor; no host entropy, ndarray, Rayon, or full "
              "distribution engine entered the browser graph."
          )
          for index, line in enumerate(lines):
              if line.startswith("**Status:**"):
                  lines[index] = status
                  break
          else:
              raise SystemExit("docs/wasm_audit.md lacks a Status line")
          audit = "\n".join(lines) + "\n"
          for authority in ("SUITE.lock", "Cargo.lock"):
              digest = hashlib.sha256(Path(authority).read_bytes()).hexdigest()
              audit, count = re.subn(rf'- `{re.escape(authority)}` SHA-256: `[0-9a-f]{{64}}`', f'- `{authority}` SHA-256: `{digest}`', audit, count=1)
              if count != 1:
                  raise SystemExit(f"could not refresh {authority} digest")
          census = "`fmn-wasm`, `fmn-anim`, `fmn-cache`, `fmn-codec`, `fmn-config`, `fmn-core`, `fmn-dmath`, `fmn-frame`, `fmn-geom`, `fmn-hash`, `fmn-mobject`, `fmn-platform`, `fmn-render`, `fmn-scene`"
          census_with = census + ", `fnp-random-core`"
          if census_with not in audit:
              if census not in audit:
                  raise SystemExit("could not locate shipped wasm package census")
              audit = audit.replace(census, census_with, 1)
          paragraph = (
              "`fnp-random-core` enters the shipped serial and shared-memory graphs only through `fmn-core`. "
              "Its package manifest has no dependencies, its crate forbids unsafe code, and it exposes "
              "deterministic state transforms only. Native and browser builds therefore exercise the same "
              "upstream PCG64DXSM state machine without admitting `fnp-random`, host entropy, array storage, "
              "or a thread pool.\n\n"
          )
          if paragraph not in audit:
              anchor = "fmn-geom now enters with its doctrine-D4 solver gateway:"
              if anchor not in audit:
                  raise SystemExit("could not locate wasm dependency explanation anchor")
              audit = audit.replace(anchor, paragraph + anchor, 1)
          old = "| `franken_numpy`, `frankenscipy`, `franken_networkx`, `frankenpandas` | not consumed by the current wasm graph; any future subset requires its own target build and governed-closure update |"
          new = "| the remainder of `franken_numpy` (`fnp-random`, arrays, linalg, I/O, and Python surfaces), plus `frankenscipy`, `franken_networkx`, and `frankenpandas` | not consumed by the current wasm graph; only dependency-free `fnp-random-core` is admitted through `fmn-core`, and any future subset requires its own target build and governed-closure update |"
          if old in audit:
              audit = audit.replace(old, new, 1)
          elif new not in audit:
              raise SystemExit("could not locate intentionally-absent suite row")
          audit_path.write_text(audit, encoding="utf-8")

          changelog = """## FrankenNumPy RNG authority cutover

### Changed
- `fmn-core` delegates NumPy-compatible SeedSequence/PCG64DXSM state transitions to dependency-free `fnp-random-core`, retaining named substreams, frame-keyed forks, and split-state journals.
- Every consumed `fnp-*` package resolves through the current single `SUITE.lock` source identity.

### Fixed
- The source-identity regression preserves legitimate multiple versions of unrelated Cargo packages while requiring each governed `fnp-*` package to resolve uniquely.

### Evidence
- Complete committed NumPy fixtures cover SeedSequence words, raw draws, doubles, named streams, and frame indices above `u32::MAX`.
- Closure regressions prove the full `fnp-random`, ndarray, Rayon, and host-entropy surfaces do not enter `fmn-core`.
- Native, wasm32, packaged browser, Node smoke, and mandatory project gates ran before closure."""
          upsert(Path("CHANGELOG.md"), "<!-- fm-ai1-changelog:start -->", "<!-- fm-ai1-changelog:end -->", changelog)
          readme = """## Deterministic RNG authority

FrankenManim's scene-level contract is one explicit root seed, length-delimited UTF-8 named substreams, and pure `(substream, frame_index)` forks. NumPy-compatible SeedSequence mixing and PCG64DXSM state transitions are owned by the dependency-free `fnp-random-core` crate at the current governed FrankenNumPy `SUITE.lock` revision. `fmn-core` wraps that primitive only to preserve split-state journals and scene stream layout. Native and browser builds share one implementation without importing the full distribution engine, OS entropy, ndarray storage, or Rayon.

The committed NumPy fixture covers SeedSequence output, raw words, doubles, named streams, and 64-bit frame indices. Permanent closure tests bind every consumed `fnp-*` package to the same `SUITE.lock` commit."""
          upsert(Path("README.md"), "<!-- fm-ai1-readme:start -->", "<!-- fm-ai1-readme:end -->", readme, append=True)
          candidates = [Path("IMPLEMENTATION_STATUS.md"), Path("docs/IMPLEMENTATION_STATUS.md"), Path("docs/implementation_status.md"), Path("docs/status.md")]
          status_path = next((candidate for candidate in candidates if candidate.exists()), candidates[1])
          implementation = """## fm-ai1: upstream deterministic RNG authority — complete

**Production behavior:** `fmn-core` delegates SeedSequence and PCG64DXSM to dependency-free `fnp-random-core` at the current governed FrankenNumPy revision. Named substreams, pure frame-keyed forks, split-state restore, and `RNG_LAYOUT_VERSION = 1` remain stable.

**Earned evidence:** complete committed NumPy vectors; state round trips; native tests and warning-denied Clippy; wasm32 compilation; exact governed-source and zero-dependency regressions; packaged browser execution; Node smoke; mandatory project gate.

**Deliberate boundary:** unseeded entropy remains a platform capability supplied before `fmn-core`; the full `fnp-random` distribution engine is not part of the native or browser closure."""
          upsert(status_path, "<!-- fm-ai1-status:start -->", "<!-- fm-ai1-status:end -->", implementation, append=True)
          Path("/tmp/fm-ai1-status-path").write_text(str(status_path), encoding="utf-8")

          issues_path = Path(".beads/issues.jsonl")
          output = []
          found = False
          for line in issues_path.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              issue = json.loads(line)
              if issue.get("id") == "fm-ai1":
                  found = True
                  issue["status"] = "closed"
                  issue["updated_at"] = now
                  issue["closed_at"] = issue.get("closed_at") or now
                  issue["close_reason"] = (
                      "Completed upstream RNG authority cutover at the current governed FrankenNumPy pin: "
                      "dependency-free fnp-random-core owns SeedSequence/PCG64DXSM; fmn-core preserves named "
                      "substreams, frame forks, and journals; complete NumPy vectors, native/wasm builds, "
                      "governed closure, browser package, Node smoke, and the mandatory gate passed."
                  )
              output.append(json.dumps(issue, separators=(",", ":"), ensure_ascii=False))
          if not found:
              raise SystemExit("fm-ai1 missing from issues.jsonl")
          issues_path.write_text("\n".join(output) + "\n", encoding="utf-8")

          receipt = {
              "schema": "franken-manim.fm-ai1-completion.v3",
              "generated_at": now,
              "tested_live_ancestor": tested,
              "franken_numpy_pin": pin,
              "authorities": {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in (
                  "Cargo.toml", "Cargo.lock", "SUITE.lock", "SUITE_ALLOWLIST.tsv",
                  "crates/fmn-core/src/rng.rs", "crates/fmn-conformance/tests/franken_numpy_pin.rs",
              )},
              "commands": [
                  "cargo test --locked -p fmn-core",
                  "cargo check --locked --target wasm32-unknown-unknown -p fmn-core",
                  "cargo test --locked -p fmn-conformance --test franken_numpy_pin",
                  "workspace_closure_is_exactly_the_governed_universe",
                  "bash scripts/check_wasm_package.sh",
                  "bash wasm-smoke/run.sh",
                  "bash scripts/check.sh",
              ],
              "verdict": "pass",
          }
          Path("artifacts/fm-ai1-completion.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def chunk(kind: bytes, payload: bytes) -> bytes:
              return struct.pack(">I", len(payload)) + kind + payload + struct.pack(">I", binascii.crc32(kind + payload) & 0xffffffff)
          width = height = 64
          pixels = (b"\x00" + b"\x20\xc8\x58" * width) * height
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
          png += chunk(b"tEXt", b"status\x00fm-ai1 completion passed") + chunk(b"IDAT", zlib.compress(pixels, 9)) + chunk(b"IEND", b"")
          Path("artifacts/fm-ai1-live-attested.png").write_bytes(png)
          Path("artifacts/fm-ai1-live-attestation.json").write_text(json.dumps({
              "schema": "franken-manim.fm-ai1-live-attestation.v2",
              "attested_at": now,
              "tested_live_ancestor": tested,
              "franken_numpy_pin": pin,
              "completion_receipt_sha256": hashlib.sha256(Path("artifacts/fm-ai1-completion.json").read_bytes()).hexdigest(),
              "verdict": "pass",
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Publish completion and self-remove
        shell: bash
        run: |
          set -euo pipefail
          status_path="$(cat /tmp/fm-ai1-status-path)"
          git rm -f .github/workflows/fm-ai1-finalizer.yml
          git add docs/wasm_audit.md README.md CHANGELOG.md "$status_path" .beads/issues.jsonl \
            artifacts/fm-ai1-completion.json artifacts/fm-ai1-live-attestation.json artifacts/fm-ai1-live-attested.png
          git diff --cached --check
          git config user.name "FrankenManim FM-AI1 Finalizer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(core): complete upstream RNG authority cutover" \
            -m "Publish the exact receipt, real browser evidence, source-identity regression, accurate project status, and earned fm-ai1 closure after testing the live governed ancestor."
          final_sha="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$parent" ]] || {
            echo "main moved during the short publication window; scheduled retry will revalidate the latest equivalent authorities" >&2
            exit 22
          }
          git push origin "$final_sha:refs/heads/main"
          git push origin "$final_sha:refs/heads/master"
          echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"

      - name: Verify strict canonical branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          while IFS= read -r branch; do
            case "$branch" in HEAD|main|master) continue;; esac
            ref="refs/remotes/origin/$branch"
            git merge-base --is-ancestor "$ref" "$FINAL_SHA" || {
              echo "refusing to delete divergent branch $branch" >&2
              exit 30
            }
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)
          mapfile -t heads < <(git ls-remote --heads origin | awk '{name=$2; sub("^refs/heads/", "", name); print name}' | sort)
          [[ "${heads[*]}" == "main master" ]] || exit 31
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          master_sha="$(git ls-remote --heads origin refs/heads/master | awk '{print $1}')"
          [[ "$main_sha" == "$master_sha" && "$main_sha" == "$FINAL_SHA" ]] || exit 32

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fm-ai1-finalizer-failure-${{ github.run_id }}
          path: |
            Cargo.toml
            Cargo.lock
            SUITE.lock
            SUITE_ALLOWLIST.tsv
            crates/fmn-core/src/rng.rs
            crates/fmn-conformance/tests/franken_numpy_pin.rs
            docs/wasm_audit.md
          if-no-files-found: warn
          retention-days: 14
