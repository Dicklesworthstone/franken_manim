name: Complete RNG Authority Cutover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/complete-rng-authority-cutover.yml"
  workflow_run:
    workflows: ["Finalize RNG Migration"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-rng-migration
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  EXPECTED_FNP_PIN: "7494a2ee97a54b06b8bd4a76c0c520edbc53cd69"

jobs:
  complete:
    if: github.repository == 'Dicklesworthstone/franken_manim'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Capture the exact source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install governed native and wasm toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-05 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup override set nightly-2026-07-05
          if ! command -v wasm-pack >/dev/null 2>&1 || [[ "$(wasm-pack --version)" != "wasm-pack 0.15.0" ]]; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi

      - name: Assert the single FrankenNumPy source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = os.environ["EXPECTED_FNP_PIN"]
          cargo = Path("Cargo.toml").read_text(encoding="utf-8")
          suite = Path("SUITE.lock").read_text(encoding="utf-8")
          packages = ("fnp-dtype", "fnp-ndarray", "fnp-io", "fnp-random-core")
          for package in packages:
              pattern = rf'^{re.escape(package)} = \{{ git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "([0-9a-f]{{40}})"'
              match = re.search(pattern, cargo, re.MULTILINE)
              if match is None:
                  raise SystemExit(f"workspace dependency {package} is missing its governed FrankenNumPy git pin")
              if match.group(1) != expected:
                  raise SystemExit(f"{package} pins {match.group(1)}, expected {expected}")
          suite_line = next((line for line in suite.splitlines() if line.startswith("franken_numpy\t")), None)
          if suite_line is None:
              raise SystemExit("SUITE.lock lacks the franken_numpy row")
          actual = suite_line.split("\t", 2)[1]
          if actual != expected:
              raise SystemExit(f"SUITE.lock pins franken_numpy at {actual}, expected {expected}")
          PY

      - name: Admit only the dependency-free random core and refresh Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("SUITE_ALLOWLIST.tsv")
          text = path.read_text(encoding="utf-8")
          row = (
              "fnp-random-core\t0.2.0\tgit+franken_numpy@SUITE.lock\t-\t-\t"
              "MIT+rider\tno\tno\tno\tno\tforbid\truntime\t"
              "fm-ai1: dependency-free SeedSequence and PCG64DXSM authority; no OS entropy, ndarray, rayon, or distribution surface; rev must equal the SUITE.lock franken_numpy pin\t"
              "fm\tsuite-lock-ritual\n"
          )
          rows = [line for line in text.splitlines(keepends=True) if not line.startswith("fnp-random-core\t")]
          text = "".join(rows)
          anchor = next(
              line
              for line in text.splitlines(keepends=True)
              if line.startswith("fnp-ndarray\t0.2.0\tgit+franken_numpy@SUITE.lock\t")
          )
          path.write_text(text.replace(anchor, anchor + row, 1), encoding="utf-8")
          PY
          cargo check -p fmn-core --all-targets

      - name: Format only the migration-owned Rust files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          mapfile -t formatted < <(git diff --name-only -- '*.rs')
          for path in "${formatted[@]}"; do
            case "$path" in
              crates/fmn-core/src/rng.rs|crates/fmn-conformance/tests/franken_numpy_pin.rs) ;;
              *) echo "rustfmt changed unrelated file $path" >&2; exit 3 ;;
            esac
          done
          git diff --check

      - name: Prove vectors, state, closure, and wasm32 compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p fmn-core
          cargo check --target wasm32-unknown-unknown -p fmn-core
          cargo test -p fmn-conformance --test governed_closure \
            workspace_closure_is_exactly_the_governed_universe -- --exact
          cargo test -p fmn-conformance --test governed_closure \
            git_dependencies_ride_their_suite_lock_pins -- --exact
          cargo test -p fmn-conformance --test governed_closure \
            suite_lock_parses_and_matches_the_pinned_toolchain -- --exact
          cargo test -p fmn-conformance --test franken_numpy_pin
          cargo clippy -p fmn-core --all-targets -- -D warnings
          cargo clippy -p fmn-conformance --test franken_numpy_pin -- -D warnings

      - name: Rebuild and execute the browser artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_wasm_package.sh
          bash wasm-smoke/run.sh

      - name: Refresh the WASM audit from the tested authorities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          path = Path("docs/wasm_audit.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          status = (
              "**Status:** re-derived 2026-09-03 after fm-ai1 moved NumPy-compatible "
              "SeedSequence and PCG64DXSM into FrankenNumPy's dependency-free `fnp-random-core` "
              "and made `fmn-core` consume that upstream authority. The real wasm32 package build, "
              "fresh npm consumer/browser exercise, and Node smoke path passed on the exact committed "
              "source before this audit was refreshed; no host entropy, ndarray, Rayon, or full "
              "distribution engine entered the browser graph."
          )
          for index, line in enumerate(lines):
              if line.startswith("**Status:**"):
                  lines[index] = status
                  break
          else:
              raise SystemExit("docs/wasm_audit.md lacks its Status line")
          text = "\n".join(lines) + "\n"

          for authority in ("SUITE.lock", "Cargo.lock"):
              digest = hashlib.sha256(Path(authority).read_bytes()).hexdigest()
              pattern = rf'- `{re.escape(authority)}` SHA-256: `[0-9a-f]{{64}}`'
              replacement = f'- `{authority}` SHA-256: `{digest}`'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"could not refresh {authority} digest in docs/wasm_audit.md")

          old_packages = "`fmn-wasm`, `fmn-anim`, `fmn-cache`, `fmn-codec`, `fmn-config`, `fmn-core`, `fmn-dmath`, `fmn-frame`, `fmn-geom`, `fmn-hash`, `fmn-mobject`, `fmn-platform`, `fmn-render`, `fmn-scene`"
          new_packages = old_packages + ", `fnp-random-core`"
          if old_packages in text and new_packages not in text:
              text = text.replace(old_packages, new_packages, 1)
          elif new_packages not in text:
              raise SystemExit("could not locate the shipped wasm package census")

          anchor = "fmn-geom now enters with its doctrine-D4 solver gateway:"
          paragraph = (
              "`fnp-random-core` enters the shipped serial and shared-memory graphs only through "
              "`fmn-core`. Its package manifest has no dependencies, and its crate forbids unsafe "
              "code and exposes deterministic state transforms only. The wasm32 build and browser "
              "execution above therefore exercise the same upstream PCG64DXSM state machine as the "
              "native engine without admitting `fnp-random`, host entropy, array storage, or a thread pool.\n\n"
          )
          if paragraph not in text:
              if anchor not in text:
                  raise SystemExit("could not locate the wasm dependency explanation anchor")
              text = text.replace(anchor, paragraph + anchor, 1)

          old_absence = "| `franken_numpy`, `frankenscipy`, `franken_networkx`, `frankenpandas` | not consumed by the current wasm graph; any future subset requires its own target build and governed-closure update |"
          new_absence = "| the remainder of `franken_numpy` (`fnp-random`, arrays, linalg, I/O, and Python surfaces), plus `frankenscipy`, `franken_networkx`, and `frankenpandas` | not consumed by the current wasm graph; only dependency-free `fnp-random-core` is admitted through `fmn-core`, and any future subset requires its own target build and governed-closure update |"
          if old_absence in text:
              text = text.replace(old_absence, new_absence, 1)
          elif new_absence not in text:
              raise SystemExit("could not locate the intentionally-absent FrankenSuite row")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Run the complete mandatory gate against refreshed evidence
        shell: bash
        run: |
          set -euo pipefail
          timeout 7200 bash scripts/check.sh

      - name: Publish truthful project status and close the earned bead
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def upsert(path: Path, start: str, end: str, body: str, *, append: bool = False) -> None:
              text = path.read_text(encoding="utf-8") if path.exists() else ""
              block = f"{start}\n{body.rstrip()}\n{end}"
              if start in text:
                  before, remainder = text.split(start, 1)
                  if end not in remainder:
                      raise SystemExit(f"{path} has an unterminated generated status block")
                  _, after = remainder.split(end, 1)
                  text = before.rstrip() + "\n\n" + block + after
              elif append or not text.startswith("#"):
                  text = text.rstrip() + "\n\n" + block + "\n"
              else:
                  first_newline = text.find("\n")
                  text = text[: first_newline + 1] + "\n" + block + "\n" + text[first_newline + 1 :].lstrip("\n")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text.rstrip() + "\n", encoding="utf-8")

          changelog = """## 2026-09-03 — FrankenNumPy RNG authority cutover

### Changed
- `fmn-core` no longer carries a private SeedSequence/PCG64DXSM implementation. It delegates the primitive state machine to FrankenNumPy's dependency-free `fnp-random-core` while retaining FrankenManim's named-substream, frame-fork, and split-journal API.
- All consumed `fnp-*` packages now share one exact `SUITE.lock` source identity.

### Added
- Full fixture parity remains enforced for SeedSequence words, raw draws, doubles, named substreams, and 64-bit frame forks.
- Permanent closure regressions prove that `fmn-core` admits no full `fnp-random`, ndarray, Rayon, or host-entropy dependency, and that every consumed FrankenNumPy package resolves to the governed pin.
- The real wasm package and Node smoke paths were rebuilt before the WASM audit was refreshed."""
          upsert(Path("CHANGELOG.md"), "<!-- fm-ai1-changelog:start -->", "<!-- fm-ai1-changelog:end -->", changelog)

          readme = """## Deterministic RNG authority

FrankenManim's scene-level contract is one explicit root seed, length-delimited UTF-8 named substreams, and pure `(substream, frame_index)` forks. The NumPy-compatible SeedSequence mixing and PCG64DXSM state transition are owned by the pinned, dependency-free `fnp-random-core` crate in FrankenNumPy. `fmn-core` wraps that primitive only to preserve split-state journals and scene stream layout. This keeps native and browser builds on one implementation without importing the full distribution engine, OS entropy, ndarray storage, or Rayon.

The complete committed NumPy fixture covers SeedSequence output, raw words, doubles, named streams, and frame indices above `u32::MAX`; closure tests additionally bind every consumed `fnp-*` package to the same `SUITE.lock` commit."""
          upsert(Path("README.md"), "<!-- fm-ai1-readme:start -->", "<!-- fm-ai1-readme:end -->", readme, append=True)

          candidates = [
              Path("IMPLEMENTATION_STATUS.md"),
              Path("docs/IMPLEMENTATION_STATUS.md"),
              Path("docs/implementation_status.md"),
              Path("docs/status.md"),
          ]
          status_path = next((candidate for candidate in candidates if candidate.exists()), candidates[1])
          status = """## fm-ai1: upstream deterministic RNG authority — complete

**Production behavior:** `fmn-core` delegates SeedSequence and PCG64DXSM to dependency-free `fnp-random-core`. Named substreams, pure frame-keyed forks, split-state restore, and `RNG_LAYOUT_VERSION = 1` remain stable.

**Earned evidence:** full committed NumPy vectors; state round trips; native tests and warning-denied Clippy; `wasm32-unknown-unknown` compilation; exact governed-source and zero-dependency regressions; packaged browser execution; Node smoke; complete `scripts/check.sh`.

**Deliberate boundary:** unseeded entropy remains a platform capability supplied before `fmn-core`; the full `fnp-random` distribution engine is not part of the native or browser closure."""
          upsert(status_path, "<!-- fm-ai1-status:start -->", "<!-- fm-ai1-status:end -->", status, append=True)
          Path(".rng-status-path").write_text(str(status_path), encoding="utf-8")

          issues_path = Path(".beads/issues.jsonl")
          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          reason = (
              "Completed the upstream RNG authority cutover: dependency-free fnp-random-core owns "
              "SeedSequence/PCG64DXSM; fmn-core preserves named substreams, frame forks, and journals; "
              "all NumPy fixture vectors, native/wasm builds, governed closure, browser package, Node "
              "smoke, and the full mandatory gate passed on the exact published tree."
          )
          output = []
          found = False
          for line in issues_path.read_text(encoding="utf-8").splitlines():
              issue = json.loads(line)
              if issue.get("id") == "fm-ai1":
                  found = True
                  issue["status"] = "closed"
                  issue["updated_at"] = now
                  issue["closed_at"] = issue.get("closed_at") or now
                  issue["close_reason"] = reason
              output.append(json.dumps(issue, separators=(",", ":"), ensure_ascii=False))
          if not found:
              raise SystemExit("fm-ai1 is absent from .beads/issues.jsonl")
          issues_path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Commit only the tested integration transaction
        shell: bash
        run: |
          set -euo pipefail
          status_path="$(cat .rng-status-path)"
          rm .rng-status-path
          git rm -f .github/workflows/complete-rng-authority-cutover.yml
          if [[ -e .github/workflows/finalize-rng-migration.yml ]]; then
            git rm -f .github/workflows/finalize-rng-migration.yml
          fi
          git add Cargo.lock SUITE_ALLOWLIST.tsv docs/wasm_audit.md README.md CHANGELOG.md \
            .beads/issues.jsonl "$status_path" crates/fmn-core/src/rng.rs \
            crates/fmn-conformance/tests/franken_numpy_pin.rs
          git diff --cached --check
          git config user.name "FrankenManim RNG Cutover"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(core): complete upstream RNG authority cutover" \
            -m "Publish the exact lock and allowlist, refreshed wasm evidence, full-vector and source-identity regressions, truthful README/changelog/status updates, and the earned fm-ai1 closure after the complete gate passed."

      - name: Publish only onto the unchanged tested main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
            echo "main moved from tested base $BASE_SHA to $(git rev-parse origin/main); refusing to publish an untested merge" >&2
            exit 4
          fi
          git push origin HEAD:main

      - name: Reconcile main/master and remove only merged branch refs
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          git push origin "$final_sha:refs/heads/master"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          while IFS= read -r branch; do
            case "$branch" in
              HEAD|main|master) continue ;;
            esac
            ref="refs/remotes/origin/$branch"
            if ! git merge-base --is-ancestor "$ref" "$final_sha"; then
              echo "refusing to delete divergent branch $branch" >&2
              git log --oneline "$final_sha".."$ref" >&2
              exit 5
            fi
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)
          mapfile -t heads < <(git ls-remote --heads origin | awk '{name=$2; sub("^refs/heads/", "", name); print name}' | sort)
          if [[ "${heads[*]}" != "main master" ]]; then
            printf 'unexpected remote heads after reconciliation:\n  %s\n' "${heads[@]}" >&2
            exit 6
          fi
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          master_sha="$(git ls-remote --heads origin refs/heads/master | awk '{print $1}')"
          if [[ "$main_sha" != "$master_sha" || "$main_sha" != "$final_sha" ]]; then
            echo "canonical mirror mismatch: final=$final_sha main=$main_sha master=$master_sha" >&2
            exit 7
          fi
