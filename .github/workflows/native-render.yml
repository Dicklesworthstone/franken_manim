name: Native Rust scene rendering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-render.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/fmn-core/**'
      - 'crates/fmn-anim/**'
      - 'crates/fmn-scene/**'
      - 'crates/fmn-cli/**'
      - 'crates/fmn-python/src/lib.rs'
      - 'crates/fmn-python/src/catalog_rate_identity.rs'
      - 'demo/wasm/bundle.fmtl'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-fmtl-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-render:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: target/portable
      CARGO_BUILD_JOBS: '2'
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: fmtl-rates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-portable-
      - name: Verify formatting of the rate protocol and witnesses
        run: |
          rustfmt --check --edition 2024 --config skip_children=true \
            crates/fmn-core/src/rate.rs \
            crates/fmn-anim/src/animation.rs crates/fmn-anim/src/bundle.rs \
            crates/fmn-anim/src/creation.rs crates/fmn-anim/src/fading.rs \
            crates/fmn-anim/src/indication.rs crates/fmn-anim/src/rotation.rs \
            crates/fmn-anim/tests/catalog_rates.rs crates/fmn-anim/tests/builtin_rate_identity.rs \
            crates/fmn-anim/tests/composition.rs crates/fmn-scene/src/timeline_bundle.rs \
            crates/fmn-scene/tests/exported_rate_identity.rs crates/fmn-scene/tests/shared_bundle.rs \
            crates/fmn-cli/tests/timeline_catalog.rs crates/fmn-cli/tests/compiled_pipeline.rs \
            crates/fmn-python/src/lib.rs crates/fmn-python/src/catalog_rate_identity.rs
      - name: Test actual source without applying patches or changing refs
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fmtl-rate-validation'
          out.mkdir()
          (out / 'source-commit.txt').write_text(os.environ['GITHUB_SHA'] + '\n')
          commands = [
              ('debug-core-anim-scene', ['cargo','test','--locked','-p','fmn-core','-p','fmn-anim','-p','fmn-scene','--no-fail-fast']),
              ('release-catalog', ['cargo','test','--release','--locked','-p','fmn-anim','--test','catalog_rates','--test','builtin_rate_identity']),
              ('release-bundle', ['cargo','test','--release','--locked','-p','fmn-scene','--test','exported_rate_identity','--test','shared_bundle','--test','shared_rate_catalog','--test','tracker_bundle','--test','method_bundle']),
              ('release-cli', ['cargo','test','--release','--locked','-p','fmn-cli','--features','cli,batch','--test','timeline_catalog','--test','compiled_pipeline','--test','readme_bundle']),
              ('wasm-player-host', ['cargo','test','--release','--locked','-p','fmn-wasm','--lib']),
              ('portal-named-rates', ['cargo','test','--locked','-p','fmn-python','--lib','catalog_rate_identity','--','--nocapture']),
              ('clippy', ['cargo','clippy','--locked','-p','fmn-core','-p','fmn-anim','-p','fmn-scene','--all-targets','--','-D','warnings']),
              ('workspace-check', ['cargo','check','--locked','--workspace','--all-targets']),
          ]
          statuses = {}
          for name, command in commands:
              print('RUN', name, flush=True)
              with (out / (name+'.log')).open('w') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
              statuses[name] = result.returncode
              print((out / (name+'.log')).read_text()[-10000:], flush=True)
              (out / 'results.json').write_text(json.dumps(statuses, indent=2))
          subprocess.run(['git','diff','--exit-code'], check=True)
          assert all(code == 0 for code in statuses.values()), statuses
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fmtl-rate-regressions-${{ github.run_id }}-${{ runner.arch }}
          path: ${{ runner.temp }}/fmtl-rate-validation
          retention-days: 7
          if-no-files-found: warn
