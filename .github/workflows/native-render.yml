name: Native Rust scene rendering

on:
  push:
    branches: [main]
    paths:
      - "crates/fmn/**"
      - "crates/fmn-output/**"
      - "Cargo.lock"
      - ".github/workflows/native-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TARGET_DIR: target/native-render
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/native-render
          key: native-render-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo test --locked -p fmn-output --no-default-features --test native_audio_capability
      - run: cargo test --locked -p fmn --test native_render --test native_camera --test public_api
      - run: cargo check --locked -p fmn --examples
      - run: cargo fmt -p fmn -- --check
      - name: Capture exact source for failed-run diagnosis
        if: always()
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/native-render-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-render-source-${{ github.sha }}
          path: ${{ runner.temp }}/native-render-source.tar.gz
          retention-days: 1
          if-no-files-found: error
