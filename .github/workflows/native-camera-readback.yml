name: Native camera readback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-camera-readback.yml'
      - 'scripts/enable_camera_readback.py'
      - 'crates/fmn-python/src/portal_readback.rs'
      - 'crates/fmn-python/python/fmn_python/camera_capture.py'
      - 'crates/fmn-python/tests/camera_readback.py'
      - 'crates/fmn-python/tests/test_camera_capture_protocol.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-camera-readback
  cancel-in-progress: false
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_TARGET_DIR: target/portable
  PYO3_PYTHON: python
  RUST_BACKTRACE: '1'
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.13'
      - name: Install pinned toolchain and NumPy
        run: |
          rustup show active-toolchain
          python -m pip install numpy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/portable
          key: cargo-${{ runner.os }}-${{ runner.arch }}-portable-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Register native capture on the current source
        run: |
          python scripts/enable_camera_readback.py
          rustfmt --edition 2024 crates/fmn-python/src/portal_readback.rs
          git diff --check
      - name: Exercise real native captures and existing bridge behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s crates/fmn-python/tests -p 'test_camera_capture_protocol.py' -v 2>&1 | tee camera-protocol.log
          cargo test --locked -p fmn-python --lib production_camera_readback_acceptance_suite -- --nocapture 2>&1 | tee camera-native.log
          cargo test --locked -p fmn-python --lib production_bridge_acceptance_suite -- --nocapture 2>&1 | tee camera-bridge.log
          cargo clippy --locked -p fmn-python --lib -- -D warnings 2>&1 | tee camera-clippy.log
      - name: Commit the tested native registration directly to main
        run: |
          git add crates/fmn-python/src/lib.rs crates/fmn-python/src/portal_readback.rs crates/fmn-python/python/fmn_python/initialization.py crates/fmn-python/tests/bridge.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(python): activate tested native camera pixel capture'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > camera-source-sha.txt
          git archive --format=tar.gz HEAD > camera-source.tar.gz
      - name: Preserve exact native validation and source
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-camera-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            camera-*.log
            camera-source-sha.txt
            camera-source.tar.gz
          retention-days: 3
