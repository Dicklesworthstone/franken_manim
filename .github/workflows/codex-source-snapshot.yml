name: Codex exact source snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Package the exact committed source without applying patches
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-snapshot"
          git rev-parse HEAD > "$RUNNER_TEMP/source-snapshot/source-commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source-snapshot/source.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-snapshot/tree.txt"
          sha256sum "$RUNNER_TEMP/source-snapshot/source.tar.gz" > "$RUNNER_TEMP/source-snapshot/SHA256SUMS"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-franken-manim-source-${{ github.sha }}
          path: ${{ runner.temp }}/source-snapshot
          if-no-files-found: error
          retention-days: 7
