name: Codex exact source snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Package the exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/franken-manim-source-sha.txt
          git archive --format=tar.gz HEAD > /tmp/franken-manim-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: codex-franken-manim-source
          path: |
            /tmp/franken-manim-source.tar.gz
            /tmp/franken-manim-source-sha.txt
          if-no-files-found: error
          retention-days: 1
