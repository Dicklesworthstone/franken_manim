name: Native project live reload
on:
  push:
    branches: [main]
    paths:
      - 'crates/fmn-cli/src/studio_project.rs'
      - 'crates/fmn-cli/src/studio_project/**'
      - 'crates/fmn-studio/src/project_watch.rs'
      - '.github/workflows/studio-project-reload.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test actual loopback rebuild transport and retry semantics
        shell: bash
        run: |
          set -euo pipefail
          printf '#[path = "%s/crates/fmn-cli/src/studio_project/reload.rs"] mod reload;\n' "$PWD" > "$RUNNER_TEMP/reload_tests.rs"
          printf '#[path = "%s/crates/fmn-cli/src/studio_project/inputs.rs"] mod inputs;\n' "$PWD" >> "$RUNNER_TEMP/reload_tests.rs"
          rustc --edition=2024 --test "$RUNNER_TEMP/reload_tests.rs" -o "$RUNNER_TEMP/reload_tests"
          "$RUNNER_TEMP/reload_tests" --nocapture
      - name: Prepare formatted source and normative context for inspection
        if: always()
        run: |
          rustfmt --edition 2024 crates/fmn-cli/src/studio_project.rs
          tar -czf "$RUNNER_TEMP/studio-source.tar.gz" crates/fmn-cli/src/studio_project.rs crates/fmn-cli/src/studio_project crates/fmn-studio/src/host.rs docs/planning/COMPREHENSIVE_PLAN_FOR_THE_DESIGN_OF_FRANKEN_MANIM.md .beads/issues.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: studio-source
          path: ${{ runner.temp }}/studio-source.tar.gz
          retention-days: 3
  native-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: studio-project-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Compile the shipping binary and exercise native-project tests
        run: |
          cargo test --locked -p fmn-cli --features cli,batch --bin fmn studio_project::
      - name: Exercise source-watch content and debounce regressions
        run: |
          cargo test --locked -p fmn-studio --lib project_watch::
