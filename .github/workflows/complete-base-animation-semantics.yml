name: Complete base Animation semantics

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/complete-base-animation-semantics.yml

permissions:
  contents: write

concurrency:
  group: complete-base-animation-semantics
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the current main tip
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Implement pinned Animation base semantics and regressions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          bootstrap_path = Path("crates/fmn-python/python/manimlib_bootstrap.py")
          tests_path = Path("crates/fmn-python/tests/bridge.py")
          source = bootstrap_path.read_text(encoding="utf-8")

          mobject_anchor = dedent('''
          class Mobject(_BridgeMobject):
              dim = 3
              data_dtype = [("point", 3), ("rgba", 4)]
              aligned_data_keys = ["point"]
              pointlike_data_keys = ["point"]
              render_primitive = 5  # moderngl.TRIANGLE_STRIP, without importing a renderer

              def __init__(self, *submobjects, **kwargs):
          ''').lstrip("\n")
          mobject_replacement = dedent('''
          class Mobject(_BridgeMobject):
              dim = 3
              data_dtype = [("point", 3), ("rgba", 4)]
              aligned_data_keys = ["point"]
              pointlike_data_keys = ["point"]
              render_primitive = 5  # moderngl.TRIANGLE_STRIP, without importing a renderer

              def __str__(self):
                  # Reference mobject.py:105. Animation's default name composes
                  # this stable class spelling instead of object.__str__'s address.
                  return type(self).__name__

              def __init__(self, *submobjects, **kwargs):
          ''').lstrip("\n")
          if mobject_anchor not in source:
              raise SystemExit("Mobject insertion anchor drifted")
          source = source.replace(mobject_anchor, mobject_replacement, 1)

          animation_start = source.index("\nclass Animation:\n") + 1
          animation_end = source.index("\n\nclass UpdateFromFunc", animation_start)
          animation_block = dedent('''
          class Animation:
              """The pinned Reference animation lifecycle over live portal families.

              Python-driven animations use this complete base protocol: validated
              Mobject input, deterministic naming, starting-family snapshots,
              helper-mobject updates, lagged sub-alphas, lifecycle status, and the
              legacy update alias. Native-segment subclasses retain their Choreo
              execution path while inheriting the same public helpers.
              """

              def __init__(
                  self,
                  mobject,
                  run_time=1.0,
                  time_span=None,
                  lag_ratio=0.0,
                  rate_func=_smooth_rate,
                  name="",
                  remover=False,
                  final_alpha_value=1.0,
                  suspend_mobject_updating=False,
              ):
                  self._validate_input_type(mobject)
                  self.mobject = mobject
                  self.run_time = run_time
                  self.time_span = time_span
                  self.rate_func = rate_func
                  self.name = name or type(self).__name__ + str(self.mobject)
                  self.remover = remover
                  self.final_alpha_value = final_alpha_value
                  self.lag_ratio = lag_ratio
                  self.suspend_mobject_updating = suspend_mobject_updating

              def _validate_input_type(self, mobject):
                  if not isinstance(mobject, Mobject):
                      raise TypeError("Animation only works for Mobjects.")

              def __str__(self):
                  return self.name

              def begin(self):
                  if self.time_span is not None:
                      _start, end = self.time_span
                      self.run_time = max(end, self.run_time)
                  self.mobject.set_animating_status(True)
                  self.starting_mobject = self.create_starting_mobject()
                  if self.suspend_mobject_updating:
                      self.mobject_was_updating = not self.mobject._is_updating_suspended()
                      self.mobject.suspend_updating()
                  self.families = list(self.get_all_families_zipped())
                  self.interpolate(0)

              def finish(self):
                  self.interpolate(self.final_alpha_value)
                  self.mobject.set_animating_status(False)
                  if (
                      self.suspend_mobject_updating
                      and getattr(self, "mobject_was_updating", False)
                  ):
                      self.mobject.resume_updating()

              def clean_up_from_scene(self, scene):
                  if self.is_remover():
                      scene.remove(self.mobject)

              def create_starting_mobject(self):
                  return self.mobject.copy()

              def get_all_mobjects(self):
                  """Ordering matches the arguments to interpolate_submobject."""
                  return self.mobject, self.starting_mobject

              def get_all_families_zipped(self):
                  return zip(*[
                      mob.get_family()
                      for mob in self.get_all_mobjects()
                  ])

              def update_mobjects(self, dt):
                  """Update helper snapshots while the surrounding Scene updates source."""
                  for mob in self.get_all_mobjects_to_update():
                      mob.update(dt)

              def get_all_mobjects_to_update(self):
                  items = [
                      mob
                      for mob in self.get_all_mobjects()
                      if mob is not self.mobject
                  ]
                  return list(reversed(dict.fromkeys(reversed(items))))

              def copy(self):
                  return _copy.deepcopy(self)

              def update_rate_info(self, run_time=None, rate_func=None, lag_ratio=None):
                  # Reference truthiness semantics are observable: explicit zero
                  # leaves an existing duration/lag unchanged.
                  self.run_time = run_time or self.run_time
                  self.rate_func = rate_func or self.rate_func
                  self.lag_ratio = lag_ratio or self.lag_ratio
                  return self

              def interpolate(self, alpha):
                  self.interpolate_mobject(alpha)

              def update(self, alpha):
                  """Legacy alias retained for old scene sources."""
                  self.interpolate(alpha)

              def time_spanned_alpha(self, alpha):
                  if self.time_span is not None:
                      start, end = self.time_span
                      return _np.clip(
                          alpha * self.run_time - start,
                          0,
                          end - start,
                      ) / (end - start)
                  return alpha

              def interpolate_mobject(self, alpha):
                  spanned_alpha = self.time_spanned_alpha(alpha)
                  for index, mobjects in enumerate(self.families):
                      sub_alpha = self.get_sub_alpha(
                          spanned_alpha,
                          index,
                          len(self.families),
                      )
                      self.interpolate_submobject(*mobjects, sub_alpha)

              def interpolate_submobject(
                  self,
                  submobject,
                  starting_submobject,
                  alpha,
              ):
                  del submobject, starting_submobject, alpha

              def get_sub_alpha(self, alpha, index, num_submobjects):
                  full_length = (num_submobjects - 1) * self.lag_ratio + 1
                  value = alpha * full_length
                  lower = index * self.lag_ratio
                  raw_sub_alpha = min(max(value - lower, 0), 1)
                  return self.rate_func(raw_sub_alpha)

              def set_run_time(self, run_time):
                  self.run_time = run_time
                  return self

              def get_run_time(self):
                  if self.time_span:
                      return max(self.run_time, self.time_span[1])
                  return self.run_time

              def set_rate_func(self, rate_func):
                  self.rate_func = rate_func
                  return self

              def get_rate_func(self):
                  return self.rate_func

              def set_name(self, name):
                  self.name = name
                  return self

              def is_remover(self):
                  return self.remover
          ''').strip("\n")
          source = source[:animation_start] + animation_block + source[animation_end:]

          transform_start = source.index("\nclass Transform(_NativeAnimation):")
          transform_methods_start = source.index(
              "\n    def create_starting_mobject(self):",
              transform_start,
          )
          transform_methods_end = source.index(
              "\n    def interpolate_mobject(self, alpha):",
              transform_methods_start,
          )
          transform_methods = dedent('''

              def create_starting_mobject(self):
                  return self.mobject.copy()

              def get_all_mobjects(self):
                  # Preserve the target itself for helper updates while
                  # interpolation consumes the aligned target copy below.
                  return (
                      self.mobject,
                      self.starting_mobject,
                      self.target_mobject,
                      self.target_copy,
                  )

              def get_all_families_zipped(self):
                  return zip(*[
                      mob.get_family()
                      for mob in (
                          self.mobject,
                          self.starting_mobject,
                          self.target_copy,
                      )
                  ])

              def interpolate_submobject(
                  self,
                  submobject,
                  starting_submobject,
                  target_copy,
                  alpha,
              ):
                  submobject.interpolate(
                      starting_submobject,
                      target_copy,
                      alpha,
                      self.path_func,
                  )
                  return self

              def begin(self):
                  # The Python updater-driving fallback builds the same four
                  # helper identities as the pinned Transform, then delegates
                  # lifecycle status, suspension, family zipping, and alpha 0
                  # interpolation to the completed Animation base.
                  self.target_mobject = self.create_target()
                  if not isinstance(self.target_mobject, Mobject):
                      raise TypeError("Transform target must be a Mobject")
                  self.target_copy = self.target_mobject.copy()
                  Animation.begin(self)
          ''').rstrip("\n")
          source = (
              source[:transform_methods_start]
              + transform_methods
              + source[transform_methods_end:]
          )
          bootstrap_path.write_text(source, encoding="utf-8")

          tests = tests_path.read_text(encoding="utf-8")
          marker = "# Base Animation semantic surface (fm-5wq.4)."
          if marker in tests:
              raise SystemExit("base Animation regression marker already exists")
          regression = dedent('''

          # Base Animation semantic surface (fm-5wq.4).
          class _FmnBaseAnimationProbe(Animation):
              def __init__(self, mobject, **kwargs):
                  self.calls = []
                  super().__init__(mobject, **kwargs)

              def interpolate_submobject(self, current, starting, alpha):
                  self.calls.append((current, starting, float(alpha)))


          assert str(Mobject()) == "Mobject"
          try:
              Animation(None)
          except TypeError as error:
              assert str(error) == "Animation only works for Mobjects."
          else:
              raise AssertionError("Animation accepted a non-Mobject target")
          assert str(Animation(Mobject())) == "AnimationMobject"

          _fmn_animation_root = Mobject(Mobject(), Mobject())
          _fmn_animation_rate = lambda value: value * value
          _fmn_animation = _FmnBaseAnimationProbe(
              _fmn_animation_root,
              run_time=2.0,
              lag_ratio=0.5,
              rate_func=_fmn_animation_rate,
              name="probe",
          )
          assert str(_fmn_animation) == "probe"
          assert _fmn_animation.get_run_time() == 2.0
          assert _fmn_animation.get_rate_func() is _fmn_animation_rate
          _fmn_animation.begin()
          assert _fmn_animation_root.is_changing()
          assert _fmn_animation.starting_mobject is not _fmn_animation_root
          assert len(_fmn_animation.families) == 3
          assert all(len(row) == 2 for row in _fmn_animation.families)
          assert [row[0] for row in _fmn_animation.families] == _fmn_animation_root.get_family()
          assert [row[1] for row in _fmn_animation.families] == _fmn_animation.starting_mobject.get_family()

          _fmn_animation.calls.clear()
          assert _fmn_animation.interpolate(0.5) is None
          assert [call[2] for call in _fmn_animation.calls] == [1.0, 0.25, 0.0]
          assert all(
              current is expected
              for (current, _starting, _alpha), expected in zip(
                  _fmn_animation.calls,
                  _fmn_animation_root.get_family(),
              )
          )
          _fmn_animation.calls.clear()
          assert _fmn_animation.update(0.25) is None
          assert [call[2] for call in _fmn_animation.calls] == [0.25, 0.0, 0.0]

          _fmn_helper_ticks = []
          _fmn_live_ticks = []
          _fmn_helper_updater = lambda mob, dt=0: _fmn_helper_ticks.append(float(dt))
          _fmn_live_updater = lambda mob, dt=0: _fmn_live_ticks.append(float(dt))
          _fmn_animation.starting_mobject.add_updater(_fmn_helper_updater, call=False)
          _fmn_animation_root.add_updater(_fmn_live_updater, call=False)
          assert _fmn_animation.get_all_mobjects_to_update() == [
              _fmn_animation.starting_mobject
          ]
          _fmn_animation.update_mobjects(0.125)
          assert _fmn_helper_ticks == [0.125]
          assert _fmn_live_ticks == []
          _fmn_animation_root.remove_updater(_fmn_live_updater)

          _fmn_animation.get_all_mobjects = lambda: (
              _fmn_animation.mobject,
              _fmn_animation.starting_mobject,
              _fmn_animation.starting_mobject,
          )
          assert _fmn_animation.get_all_mobjects_to_update() == [
              _fmn_animation.starting_mobject
          ]
          del _fmn_animation.get_all_mobjects

          _fmn_animation.calls.clear()
          _fmn_animation_clone = _fmn_animation.copy()
          assert _fmn_animation_clone is not _fmn_animation
          assert _fmn_animation_clone.mobject is not _fmn_animation.mobject
          _fmn_linear_rate = lambda value: value
          assert _fmn_animation.update_rate_info(4.0, _fmn_linear_rate, 0.75) is _fmn_animation
          assert _fmn_animation.run_time == 4.0
          assert _fmn_animation.rate_func is _fmn_linear_rate
          assert _fmn_animation.lag_ratio == 0.75
          _fmn_animation.update_rate_info(0, None, 0)
          assert _fmn_animation.run_time == 4.0
          assert _fmn_animation.rate_func is _fmn_linear_rate
          assert _fmn_animation.lag_ratio == 0.75
          assert _fmn_animation.set_run_time(3.0) is _fmn_animation
          assert _fmn_animation.set_rate_func(_fmn_animation_rate) is _fmn_animation
          assert _fmn_animation.set_name("renamed") is _fmn_animation
          assert str(_fmn_animation) == "renamed"
          _fmn_animation.finish()
          assert not _fmn_animation_root.is_changing()

          _fmn_suspended_root = Mobject()
          _fmn_suspended_animation = _FmnBaseAnimationProbe(
              _fmn_suspended_root,
              suspend_mobject_updating=True,
          )
          _fmn_suspended_animation.begin()
          assert _fmn_suspended_root._is_updating_suspended()
          _fmn_suspended_animation.finish()
          assert not _fmn_suspended_root._is_updating_suspended()
          assert not _fmn_suspended_root.is_changing()

          _fmn_spanned = _FmnBaseAnimationProbe(
              Mobject(),
              run_time=1.0,
              time_span=(0.25, 0.75),
          )
          assert _fmn_spanned.time_spanned_alpha(0.0) == 0.0
          assert _fmn_spanned.time_spanned_alpha(0.5) == 0.5
          assert _fmn_spanned.time_spanned_alpha(1.0) == 1.0
          assert _fmn_spanned.get_run_time() == 1.0

          _fmn_transform_source = Mobject()
          _fmn_transform_target = Mobject()
          _fmn_transform = Transform(
              _fmn_transform_source,
              _fmn_transform_target,
              run_time=1.0,
              rate_func=_fmn_linear_rate,
          )
          _fmn_transform.begin()
          assert _fmn_transform_source.is_changing()
          assert _fmn_transform.get_all_mobjects() == (
              _fmn_transform_source,
              _fmn_transform.starting_mobject,
              _fmn_transform_target,
              _fmn_transform.target_copy,
          )
          _fmn_transform_families = list(_fmn_transform.get_all_families_zipped())
          assert len(_fmn_transform_families) == 1
          assert _fmn_transform_families[0] == (
              _fmn_transform_source,
              _fmn_transform.starting_mobject,
              _fmn_transform.target_copy,
          )
          assert _fmn_transform.get_all_mobjects_to_update() == [
              _fmn_transform.starting_mobject,
              _fmn_transform_target,
              _fmn_transform.target_copy,
          ]
          _fmn_transform_ticks = []
          _fmn_source_ticks = []
          _fmn_source_updater = lambda mob, dt=0: _fmn_source_ticks.append(float(dt))
          _fmn_transform_source.add_updater(_fmn_source_updater, call=False)
          for _fmn_label, _fmn_helper in (
              ("start", _fmn_transform.starting_mobject),
              ("target", _fmn_transform_target),
              ("target_copy", _fmn_transform.target_copy),
          ):
              _fmn_helper.add_updater(
                  lambda mob, dt=0, label=_fmn_label: _fmn_transform_ticks.append(
                      (label, float(dt))
                  ),
                  call=False,
              )
          _fmn_transform.update_mobjects(0.2)
          assert _fmn_transform_ticks == [
              ("start", 0.2),
              ("target", 0.2),
              ("target_copy", 0.2),
          ]
          assert _fmn_source_ticks == []
          _fmn_transform_source.remove_updater(_fmn_source_updater)
          _fmn_transform.finish()
          assert not _fmn_transform_source.is_changing()
          ''').rstrip() + "\n"
          tests_path.write_text(tests.rstrip() + regression, encoding="utf-8")
          PY

      - name: Validate Python syntax and source hygiene
        run: |
          python -m py_compile crates/fmn-python/python/manimlib_bootstrap.py
          python -m py_compile crates/fmn-python/tests/bridge.py
          git diff --check

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Python portal contract suite
        run: cargo test --locked -p fmn-python

      - name: Run API conformance suite
        run: cargo test --locked -p fmn-conformance

      - name: Commit substantive implementation
        run: |
          git config user.name "FrankenManim implementation agent"
          git config user.email "actions@users.noreply.github.com"
          git add crates/fmn-python/python/manimlib_bootstrap.py crates/fmn-python/tests/bridge.py
          git commit \
            -m "fix(python): complete base Animation semantics" \
            -m "Implement the pinned Animation lifecycle, family zipping, helper updates, lagged sub-alpha calculation, fluent rate/name surface, deep copy, validation, and stable Mobject naming. Complete the Python Transform helper-family contract and add permanent portal regressions." \
            -m "Relates-to: fm-5wq.4"

      - name: Rebase and push directly to main
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
