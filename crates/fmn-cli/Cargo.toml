[package]
name = "fmn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The `fmn` binary"

[[bin]]
name = "fmn"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "runtime_boundary"
path = "tests/runtime_boundary.rs"
required-features = ["cli"]

[dependencies]
fmn-core.workspace = true
fmn-config.workspace = true
fmn-cache.workspace = true
fmn-frame.workspace = true
fmn-codec.workspace = true
fmn-platform = { workspace = true, features = ["exact-process"] }
fmn-runtime.workspace = true
fmn-render.workspace = true
fmn-scene.workspace = true
fmn-studio.workspace = true
fmn-output = { workspace = true, features = ["exact-process"] }
fmn-library.workspace = true
fmn.workspace = true
asupersync = { workspace = true, optional = true }

[features]
batch = ["cli", "dep:asupersync"]
cli = []
metal = ["cli", "fmn-studio/metal"]

[lints]
workspace = true
